<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-label="DTaaS">
  <!--
    The same geometry as src/components/BrandMark.tsx, in concrete colours,
    because a browser tab has no theme to inherit from.

    The field is the navy the university's own site uses for a solid block,
    #002546, and the drawn half is the cyan of the secondary palette. The mark
    carries its own ground, so it reads on a light tab strip and a dark one.
  -->
  <defs>
    <clipPath id="built"><rect x="0" y="0" width="12" height="24"/></clipPath>
    <clipPath id="drawn"><rect x="12" y="0" width="12" height="24"/></clipPath>
  </defs>
  <rect width="24" height="24" rx="5.28" fill="#002546"/>
  <g transform="translate(4.08,4.08) scale(0.66)">
    <g clip-path="url(#built)">
      <circle cx="12" cy="7.8" r="4.1" fill="#ffffff" stroke="#ffffff" stroke-width="1.7"/>
      <path d="M3.6 21.5 c0 -4.7 3.8 -7.4 8.4 -7.4 s8.4 2.7 8.4 7.4 Z" fill="#ffffff" stroke="#ffffff" stroke-width="1.7" stroke-linejoin="round"/>
    </g>
    <g clip-path="url(#drawn)">
      <circle cx="12" cy="7.8" r="4.1" fill="none" stroke="#37a0cb" stroke-width="1.7"/>
      <path d="M3.6 21.5 c0 -4.7 3.8 -7.4 8.4 -7.4 s8.4 2.7 8.4 7.4 Z" fill="none" stroke="#37a0cb" stroke-width="1.7" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
