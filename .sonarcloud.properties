# SonarCloud automatic analysis reads this file.
# Each service keeps its own flat ESLint config, so the configs repeat by
# design and are not duplicated logic. The diagram originals keep light and
# dark HTML and SVG copies of each diagram, which are near-identical by design.
sonar.cpd.exclusions=**/eslint.config.js,**/eslint.config.mjs,docs/assets/diagrams/originals/**
