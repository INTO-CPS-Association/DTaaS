# This is the config for DTaaS CLI

name="Digital Twin as a Service (DTaaS)"
version="2.2.0"
owner="The INTO-CPS-Association"
git-repo="https://github.com/into-cps-association/DTaaS.git"

[common]
server-dns="localhost"
# Absolute path to the DTaaS installation. Separate it with / or \\, never a
# single \, which fails with "Invalid unicode value".
path="/home/XXX/DTaaS"
# Windows example
#path="C:\\Users\\XXX\\DTaaS"

[common.security]
# HTTPS/TLS for secure server deployments.
tls=true
# Where the TLS pair (fullchain.pem, privkey.pem) is kept. 'dtaas deployment
# generate' copies the latest pair into certs/; unset means copy them by hand.
certs-src='/etc/letsencrypt/archive/intocps.org'
# Windows example
#certs-src='C:/Certbot/archive/intocps.org'

[common.resources]
# Enforce the per-user limits below; false creates users with no CPU, memory
# or process caps and ignores the fields.
set_limits=true
cpus=4 # Virtual CPU
mem_limit="4G"
pids_limit=4960 # Number of processes
shm_size="512m" # Shared memory size


# Starting users, one record per block: the desired state, set once at
# install time. Users added later with 'dtaas user add' are NOT tracked here;
# they live in the CLI owned dtaas.users.registry.json, and 'user add' and
# 'user delete' never write to this file.
[[users]]
username="username1"
email="username1@intocps.org"
groups=["default","dtaas"]
load_balance=true

[[users]]
username="username2"
email="username2@intocps.org"
groups=["default","dtaas"]
load_balance=false

[[users]]
# groups is always a list, and may carry tags beyond "default" and "dtaas".
username="username3"
email="username3@intocps.org"
groups=["default","dtaas","beta-testers","load-balanced-tier1"]
load_balance=true

# --- GitLab user provisioning for users added with 'dtaas user add' --------
# When enabled, 'user add' also creates each new user's GitLab account, a
# Personal Access Token and their two repositories. Off by default, so
# existing deployments are unaffected.
[gitlab]
provision=false
api_url="https://gitlab.com"
ssl_verify=true
# The admin PAT that creates all of that on api_url; it must be able to
# create users. Prefer the DTAAS_GITLAB_PAT environment variable, which keeps
# the token off disk: a value set here wins over it, so leave the placeholder
# commented out. This file is generated mode 0600 and gitignored.
#pat="glpat-xxxxxxxxxxxxxxxxxxxx"
# One template repository per project, imported as it stands, every branch
# included. GitLab does the import, so it needs the "Repository by URL"
# import source enabled and network access to both URLs. There is no built-in
# fallback: drop both keys to provision accounts and tokens without any
# repositories, or point them at your own repositories.
common_template="https://gitlab.com/dtaas/common.git"
user_template="https://gitlab.com/dtaas/user1.git"
# Minutes to wait for one import before failing that project. Optional, 10.
import_timeout=10
# Minutes a whole 'user add' run may spend waiting on imports before it stops
# starting new users and reports the rest as not attempted. Optional, 60.
import_deadline=60

# Installation-specific configuration
# For non-localhost deployments, the starting usernames (USERNAME1,
# USERNAME2, ...) are taken from the [[users]] records above.

# OAuth application for the client website (React frontend), separate from
# the server one below. Create it in GitLab under Settings > Applications
# (personal) or Admin Area > Applications (instance wide), with Redirect URI
# "https://<server-dns>/Library", Confidential unticked, scopes openid,
# profile, read_user, read_repository, api.
[frontend]
react-app-client-id="your_client_id_here"
# GitLab instance URL, no trailing slash
react-app-oauth-url="https://gitlab.com"

[localhost]
default-user="user1"
client-id="your_client_id_here"
auth-authority="https://gitlab.com/"

# OAuth application for the server (traefik-forward-auth), separate from the
# [frontend] one. Create it the same way, with Redirect URI
# "https://<server-dns>/_oauth", Confidential ticked, scopes openid, profile,
# read_user.
[insecure-server]
oauth-url="https://gitlab.com"
oauth-client-id="your_client_id_here"
oauth-client-secret="your_client_secret_here"
oauth-secret="your_random_secret_key_here"

[secure-server]
oauth-url="https://gitlab.com"
oauth-client-id="your_client_id_here"
oauth-client-secret="your_client_secret_here"
oauth-secret="your_random_secret_key_here"

[secure-server-gitlab]
oauth-url="https://gitlab.com"
oauth-client-id="your_client_id_here"
oauth-client-secret="your_client_secret_here"
oauth-secret="your_random_secret_key_here"

[workspace-localhost]
default-user="user"
client-id="mock"
auth-authority="http://localhost:5556/dex"

[workspace-secure-server]
oauth-secret="your_random_secret_key_here"
keycloak-admin="admin"
keycloak-admin-password="changeme"
keycloak-realm="dtaas"
keycloak-issuer-url="https://your_server_dns/auth/realms/dtaas"
keycloak-client-id="dtaas-workspace"
keycloak-client-secret="your_keycloak_client_secret_here"
client-id="dtaas-client"
auth-authority="https://your_server_dns/auth/realms/dtaas"
