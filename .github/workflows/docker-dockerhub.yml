# Reusable workflow for building and pushing a Docker Image to DockerHub.
#
# Auth username is taken from the repository secret, "DOCKERHUB_USERNAME"
# Publish username is taken from the repository secret, "DOCKERHUB_SCOPE"
# Password is taken from the repository secret, "DOCKERHUB_TOKEN"
#
# NOTE: DockerHub currently does not provide PATs for organizations.
# Users belonging to the org must use their own, which is why we need a
# username to publish through: DOCKERHUB_USERNAME, and a username to publish
# under: DOCKERHUB_SCOPE.
# You may use the same username for both.
#
# Each platform builds natively on its own runner and is pushed by
# digest. The merge job then tags one multi-platform manifest that
# points at both digests. Credentials go only to the steps that use them,
# never through env, so dependency install scripts cannot read them.

name: Build and Push Docker Image (DockerHub)

permissions:
  contents: read  # Required for checking out the code

'on':
  workflow_call:
    inputs:
      image-name:
        required: true
        type: string
      version:
        required: true
        type: string
      dockerfile:
        required: true
        type: string
      readme-file:
        required: true
        type: string
    secrets:
      # Username used for DockerHub authorization
      DOCKERHUB_USERNAME:
        required: true
        # Username under which the image will be published
      DOCKERHUB_SCOPE:
        required: true
        # Personal Access Token created by the user `DOCKERHUB_USERNAME`
        # Must have read, write and delete permissions
      DOCKERHUB_TOKEN:
        required: true

concurrency:
  group: ${{ github.workflow }}-docker-dockerhub-${{ inputs.image-name }}-${{ github.ref }}
  # Never cancel a publish halfway: it would leave untagged digests.
  cancel-in-progress: false

env:
  registry: docker.io
  IMAGE_BASE: docker.io/${{ secrets.DOCKERHUB_SCOPE }}/${{ inputs.image-name }}
  IMAGE_TAG: docker.io/${{ secrets.DOCKERHUB_SCOPE }}/${{ inputs.image-name }}:${{ inputs.version }}

jobs:
  check-version:
    name: Check if version exists
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}  # Uses only the Docker Hub token, not GITHUB_TOKEN
    outputs:
      exists: ${{ steps.check_version.outputs.exists }}

    steps:
      - name: Log in to the Container registry
        # v4.6.0
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ${{ env.registry }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Check if version exists
        id: check_version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # Fail closed: only "not found" means the version is new, so a registry
          # error cannot overwrite a published tag. New repositories must exist.
          if out=$(docker buildx imagetools inspect "$IMAGE_TAG" 2>&1); then
            echo "Version ${VERSION} already exists."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif grep -qiE 'not found|manifest unknown|repository does not exist' <<< "$out"; then
            echo "Version ${VERSION} does not exist."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' "$out" >&2
            exit 1
          fi

  build-and-push-image:
    name: Build and push Docker image (${{ matrix.arch }})
    needs: check-version
    if: needs.check-version.outputs.exists == 'false'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    permissions:
      contents: read  # Required for checking out the code
    steps:
      - name: Checkout Repository
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          lfs: false
          persist-credentials: false

      - name: Setup node
        if: ${{ inputs.image-name == 'dtaas-web' }}
        # v7.0.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26
          # No dependency cache in a publish job, so a poisoned cache entry
          # cannot reach a published image.
          package-manager-cache: false

      - name: Build react client website
        if: ${{ inputs.image-name == 'dtaas-web' }}
        run: |
          cd client/
          yarn install --frozen-lockfile --network-timeout 1000000
          yarn build

      - name: Set up Docker Buildx
        # v4.4.1
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Log in to the Container registry
        # v4.6.0
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ${{ env.registry }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image by digest
        id: build
        # v7.4.0
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: ./developer/check/${{ inputs.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE_BASE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - name: Upload image digest
        # v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: digests-dockerhub-${{ inputs.image-name }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  merge-manifest:
    name: Push multi-platform manifest
    needs: [check-version, build-and-push-image]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}  # Uses only the Docker Hub token, not GITHUB_TOKEN
    steps:
      - name: Download image digests
        # v8.0.1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-dockerhub-${{ inputs.image-name }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        # v4.4.1
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Log in to the Container registry
        # v4.6.0
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ${{ env.registry }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create and push the version and latest tags
        working-directory: ${{ runner.temp }}/digests
        env:
          VERSION: ${{ inputs.version }}
        run: |
          shopt -s nullglob
          sources=()
          for digest in *; do
            sources+=("${IMAGE_BASE}@sha256:${digest}")
          done
          if [ "${#sources[@]}" -ne 2 ]; then
            echo "Expected one digest for each of 2 platforms, found ${#sources[@]}." >&2
            exit 1
          fi
          docker buildx imagetools create \
            --tag "${IMAGE_BASE}:${VERSION}" \
            --tag "${IMAGE_BASE}:latest" \
            "${sources[@]}"
          docker buildx imagetools inspect "${IMAGE_BASE}:${VERSION}"

  update-description:
    name: Update Docker Hub description
    needs: [check-version, build-and-push-image, merge-manifest]
    # Runs when the version already existed as well as after a new push.
    if: ${{ !cancelled() && needs.check-version.result == 'success' && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read  # Required for checking out the readme file
    steps:
      - name: Checkout Repository
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          lfs: false
          persist-credentials: false

      - name: Docker Hub Description
        # v5.0.0
        uses: >-
          peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_SCOPE }}/${{ inputs.image-name }}
          readme-filepath: ${{ inputs.readme-file }}
