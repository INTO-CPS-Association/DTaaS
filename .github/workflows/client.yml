name: React website

'on':
  push:
    paths:
      - 'client/**'
  pull_request:
    paths:
      - 'client/**'
      - 'developer/client.dockerfile'
      - 'developer/client.built.dockerfile'
      - '.github/workflows/client.yml'
      - '.github/workflows/docker-build.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    name: Test react website
    permissions:
      contents: read  # Required for checking out the code
      actions: write  # Required for uploading artifacts
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: client/
    steps:
      - name: Checkout
        # v6.0.1
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          lfs: false

      - name: Setup node
        # v6.1.0
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f
        with:
          node-version: 24
          cache: "yarn"
          cache-dependency-path: "**/yarn.lock"

      - name: Cache Playwright browsers
        # v4.3.0
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cache/ms-playwright
            ~/AppData/Local/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('client/yarn.lock') }}

      - name: Install dependencies
        run: yarn install --network-timeout 1000000

      - name: Install Playwright browsers
        # Playwright's downloader has no idle-socket timeout: if the CDN stops
        # sending bytes mid-artifact the install hangs until the job times out
        # (seen on both runners). Run it with a per-attempt timeout, kill the
        # stalled process tree, and retry with a fresh connection.
        shell: bash
        run: |
          node --input-type=commonjs <<'EOF'
          const { spawn } = require('node:child_process');
          const ATTEMPT_TIMEOUT_MS = 5 * 60 * 1000;
          const MAX_ATTEMPTS = 3;
          const isWindows = process.platform === 'win32';
          const run = () =>
            new Promise((resolve) => {
              const child = spawn(
                'yarn',
                ['playwright', 'install', '--with-deps', 'chromium', 'firefox'],
                { stdio: 'inherit', shell: isWindows, detached: !isWindows },
              );
              const timer = setTimeout(() => {
                console.error(`Download stalled; aborting after ${ATTEMPT_TIMEOUT_MS / 1000}s`);
                if (isWindows) {
                  spawn('taskkill', ['/pid', String(child.pid), '/t', '/f']);
                } else {
                  try { process.kill(-child.pid, 'SIGKILL'); } catch {}
                }
              }, ATTEMPT_TIMEOUT_MS);
              child.on('exit', (code) => { clearTimeout(timer); resolve(code ?? 1); });
              child.on('error', (err) => { clearTimeout(timer); console.error(err); resolve(1); });
            });
          (async () => {
            for (let attempt = 1; attempt <= MAX_ATTEMPTS; attempt += 1) {
              const code = await run();
              if (code === 0) process.exit(0);
              console.error(`Attempt ${attempt}/${MAX_ATTEMPTS} failed (exit ${code}); retrying`);
            }
            console.error(`Playwright browser install failed after ${MAX_ATTEMPTS} attempts`);
            process.exit(1);
          })();
          EOF

      - name: Run the linting checks
        run: |
          yarn syntax

      - name: Build the React SPA website and setup env
        run: |
          yarn build
          yarn config:test

      - name: Run client unit and integration tests
        run: |
          yarn test:int
          yarn test:unit
          yarn test:coverage:int-unit

      - name: Upload unit and integration test coverage to Codecov
        # v5.5.2
        uses: codecov/codecov-action@671740ac38dd9b0130fbe1cec585b89eea48d3de
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: client/coverage/all/coverage-final.json
          flags: client-unit-integration-tests

      - name: Run e2e tests
        continue-on-error: true
        run: |
          yarn test:e2e

      - name: Upload Playwright Report (Linux)
        # v6.0.0
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        with:
          name: playwright-report-linux
          path: client/playwright-report/**
          retention-days: 5

      - name: Upload Playwright Report (Windows)
        # v6.0.0
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: ${{ !cancelled() && runner.os == 'Windows'}}
        with:
          name: playwright-report-windows
          path: client/playwright-report/**
          retention-days: 5

      - name: Upload e2e test coverage to Codecov
        # v5.5.2
        uses: codecov/codecov-action@671740ac38dd9b0130fbe1cec585b89eea48d3de
        with:
          files: client/coverage/e2e/codecov.json
          flags: client-e2e-tests

  build-docker-image:
    name: Build Docker image (${{ matrix.image-name }})
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - image-name: dtaas-web
            dockerfile: client.dockerfile
          - image-name: dtaas-web-built
            dockerfile: client.built.dockerfile
    uses: ./.github/workflows/docker-build.yml
    with:
      image-name: ${{ matrix.image-name }}
      dockerfile: ${{ matrix.dockerfile }}

  get-version:
    name: Get version
    permissions:
      contents: read  # Required for checking out the code
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        # v6.0.1
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          lfs: false

      - name: Install jq
        run: sudo apt-get install -y jq
      - name: get version
        id: get-version
        run: |
          version=$(jq -r '.version' ./client/package.json)
          echo "version=$version" >> $GITHUB_OUTPUT
    outputs:
      version: ${{ steps.get-version.outputs.version }}

  publish-docker-image-ghcr:
    permissions:
      contents: read  # Required for checking out the code
      packages: write  # Push to github package registry
    if: |
      github.event_name == 'push' &&
      (
        startsWith(github.ref, 'refs/heads/feature/') ||
        startsWith(github.ref, 'refs/heads/release-v')
      )

    name: Publish Docker image (GHCR)
    needs: [client, get-version]
    uses: ./.github/workflows/docker-ghcr.yml
    with:
      image-name: dtaas-web
      version: ${{ needs.get-version.outputs.version }}
      dockerfile: client.built.dockerfile
    secrets: inherit

  publish-docker-image-dockerhub:
    permissions:
      contents: read  # Required for checking out the code
      packages: write  # Required for publishing to github package registry
    if: |
      github.event_name == 'push' &&
      (
        startsWith(github.ref, 'refs/heads/feature/') ||
        startsWith(github.ref, 'refs/heads/release-v')
      )

    name: Publish Docker image (DockerHub)
    needs: [client, get-version]
    uses: ./.github/workflows/docker-dockerhub.yml
    with:
      image-name: dtaas-web
      version: ${{ needs.get-version.outputs.version }}
      dockerfile: client.built.dockerfile
      readme-file: client/DOCKER.md
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_SCOPE: ${{ secrets.DOCKERHUB_SCOPE }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
