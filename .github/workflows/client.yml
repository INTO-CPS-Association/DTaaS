name: React website

'on':
  push:
    paths:
      - 'client/**'
  pull_request:
    paths:
      - 'client/**'
      - 'developer/check/client.dockerfile'
      - 'developer/check/client.built.dockerfile'
      - '.github/workflows/client.yml'
      - '.github/workflows/docker-build.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  client:
    name: Test react website
    permissions:
      contents: read  # Required for checking out the code
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: client/
    steps:
      - name: Checkout
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          lfs: false

      - name: Setup node
        # v7.0.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26
          cache: "yarn"
          cache-dependency-path: "**/yarn.lock"

      - name: Install dependencies
        run: |
          yarn install --network-timeout 1000000

      - name: Run the linting checks
        run: |
          yarn syntax

      - name: Build the React SPA website and setup env
        run: |
          yarn build
          yarn config:test

      - name: Run client unit and integration tests
        run: |
          yarn test:int
          yarn test:unit
          yarn test:coverage:int-unit

      - name: Upload unit and integration test coverage to Codecov
        # v7.1.1
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: client/coverage/all/coverage-final.json
          flags: client-unit-integration-tests

  build-docker-image:
    name: Build Docker image (${{ matrix.image-name }})
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - image-name: dtaas-web
            dockerfile: client.dockerfile
          - image-name: dtaas-web-built
            dockerfile: client.built.dockerfile
    uses: ./.github/workflows/docker-build.yml
    with:
      image-name: ${{ matrix.image-name }}
      dockerfile: ${{ matrix.dockerfile }}

  get-version:
    name: Get version
    permissions:
      contents: read  # Required for checking out the code
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          lfs: false

      - name: Install jq
        run: sudo apt-get install -y jq
      - name: get version
        id: get-version
        run: |
          version=$(jq -r '.version' ./client/package.json)
          echo "version=$version" >> $GITHUB_OUTPUT
    outputs:
      version: ${{ steps.get-version.outputs.version }}

  publish-docker-image-ghcr:
    permissions:
      contents: read  # Required for checking out the code
      packages: write  # Push to github package registry
    if: |
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/feature/distributed-demo'

    name: Publish Docker image (GHCR)
    needs: [client, get-version]
    uses: ./.github/workflows/docker-ghcr.yml
    with:
      image-name: dtaas-web
      version: ${{ needs.get-version.outputs.version }}
      dockerfile: client.built.dockerfile
    secrets: inherit

  publish-docker-image-dockerhub:
    permissions:
      contents: read  # Required for checking out the code
    if: |
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/feature/distributed-demo'

    name: Publish Docker image (DockerHub)
    needs: [client, get-version]
    uses: ./.github/workflows/docker-dockerhub.yml
    with:
      image-name: dtaas-web
      version: ${{ needs.get-version.outputs.version }}
      dockerfile: client.built.dockerfile
      readme-file: client/DOCKER.md
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_SCOPE: ${{ secrets.DOCKERHUB_SCOPE }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
