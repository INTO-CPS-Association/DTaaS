# Reusable workflow for building and pushing a Docker Image to GHCR.
#
# Username is the repository owner converted to lowercase
# Password is taken from the auto-generated GitHub token
#
# Each platform builds natively on its own runner and is pushed by
# digest. The merge job then tags one multi-platform manifest that
# points at both digests.

name: Build and Push Docker Image (GHCR)

'on':
  workflow_call:
    inputs:
      image-name:
        required: true
        type: string
      version:
        required: true
        type: string
      dockerfile:
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-docker-ghcr-${{ inputs.image-name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  registry: ghcr.io
  password: ${{ secrets.GITHUB_TOKEN }}

permissions:
  contents: read  # Required for checking out the code
  packages: write  # Push to github package registry

jobs:
  check-version:
    name: Check if version exists
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      packages: read  # Read the github package registry

    outputs:
      exists: ${{ steps.check_version.outputs.exists }}
      image_base: ${{ steps.image_vars.outputs.image_base }}

    steps:
      - name: Resolve image variables
        id: image_vars
        run: |
          ghcr_scope="${REPOSITORY_OWNER,,}"
          image_repository="${REGISTRY}/${ghcr_scope}"
          image_base="${image_repository}/${IMAGE_NAME}"
          image_tag="${image_base}:${VERSION}"
          {
            echo "ghcr_scope=$ghcr_scope"
            echo "image_repository=$image_repository"
            echo "image_base=$image_base"
            echo "image_tag=$image_tag"
          } >> "$GITHUB_OUTPUT"
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          REGISTRY: ${{ env.registry }}
          IMAGE_NAME: ${{ inputs.image-name }}
          VERSION: ${{ inputs.version }}

      - name: Log in to the Container registry
        # v4.6.0
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ${{ env.registry }}
          username: ${{ github.actor }}
          password: ${{ env.password }}

      - name: Check if version exists
        id: check_version
        run: |
          IMAGE_TAG="${{ steps.image_vars.outputs.image_tag }}"
          if docker manifest inspect "$IMAGE_TAG" > /dev/null 2>&1; then
            echo "Version ${{ inputs.version }} already exists."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "Version ${{ inputs.version }} does not exist."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-push-image:
    name: Build and push Docker image (${{ matrix.arch }})
    needs: check-version
    if: needs.check-version.outputs.exists == 'false'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    permissions:
      packages: write  # Push to github package registry
      contents: read  # Required for checking out the code

    env:
      IMAGE_BASE: ${{ needs.check-version.outputs.image_base }}

    steps:
      - name: Checkout Repository
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          lfs: false

      - name: Setup node for building the React client website
        if: ${{ inputs.image-name == 'dtaas-web' }}
        # v7.0.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26
          cache: "yarn"
          cache-dependency-path: "**/yarn.lock"

      - name: Build react client website
        if: ${{ inputs.image-name == 'dtaas-web' }}
        run: |
          cd client/
          yarn install --network-timeout 1000000
          yarn build

      - name: Set up Docker Buildx
        # v4.4.1
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Log in to the Container registry
        # v4.6.0
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ${{ env.registry }}
          username: ${{ github.actor }}
          password: ${{ env.password }}

      - name: Build and push Docker image by digest
        id: build
        # v7.4.0
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: ./developer/check/${{ inputs.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          cache-from: type=gha,scope=${{ inputs.dockerfile }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ inputs.dockerfile }}-${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE_BASE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - name: Upload image digest
        # v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: digests-ghcr-${{ inputs.image-name }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-manifest:
    name: Push multi-platform manifest
    needs: [check-version, build-and-push-image]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      packages: write  # Push to github package registry

    steps:
      - name: Download image digests
        # v8.0.1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-ghcr-${{ inputs.image-name }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        # v4.4.1
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Log in to the Container registry
        # v4.6.0
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ${{ env.registry }}
          username: ${{ github.actor }}
          password: ${{ env.password }}

      - name: Create and push the version and latest tags
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE_BASE: ${{ needs.check-version.outputs.image_base }}
          VERSION: ${{ inputs.version }}
        run: |
          sources=()
          for digest in *; do
            sources+=("${IMAGE_BASE}@sha256:${digest}")
          done
          docker buildx imagetools create \
            --tag "${IMAGE_BASE}:${VERSION}" \
            --tag "${IMAGE_BASE}:latest" \
            "${sources[@]}"
          docker buildx imagetools inspect "${IMAGE_BASE}:${VERSION}"
