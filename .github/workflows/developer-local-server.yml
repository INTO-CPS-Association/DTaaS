name: Local Server Script

'on':
  push:
    paths: &local_server_paths
      - 'developer/local-server/**'
      - '.pylintrc'
      - '.github/workflows/developer-local-server.yml'
  pull_request:
    paths: *local_server_paths
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint and Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # The oldest and the newest Python the script supports
        python-version: ['3.10', '3.14']
    defaults:
      run:
        working-directory: developer/local-server
    steps:
      - name: Checkout code
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          lfs: false

      - name: Set up Python
        # v7.0.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}

      # The script uses only the standard library; these are the checks.
      - name: Install checking tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pylint pytest

      - name: Run flake8
        run: flake8 . --max-complexity=10 --max-line-length=127

      - name: Run pylint
        run: pylint . --rcfile=../../.pylintrc --recursive=y

      - name: Run unit tests
        run: python -m pytest
