name: Test and Publish

'on':
  workflow_call:
    inputs:
      registry-url:
        required: true
        type: string
      directory:
        required: true
        type: string
      node-version:
        required: true
        type: string
      package-name:
        default: ''
        type: string
    secrets:
      NPM_TOKEN:
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ inputs.registry-url }}-${{ inputs.directory }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      packages: write  # Push to github package registry
      contents: read   # Required for checking out the code
    defaults:
      run:
        working-directory: ${{ inputs.directory }}

    steps:
      - name: Checkout
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          lfs: false

      - name: Setup node
        # v7.0.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: ${{ inputs.registry-url }}

      - name: Rename package name in package.json
        if: ${{ inputs.package-name != '' }}
        env:
          PACKAGE_NAME: ${{ inputs.package-name }}
        run: |
          sudo apt-get install -y jq
          jq --arg name "$PACKAGE_NAME" '.name = $name' package.json > temp.json
          mv temp.json package.json

      - name: Publish npm package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          yarn install
          yarn build
          yarn publish --access public
