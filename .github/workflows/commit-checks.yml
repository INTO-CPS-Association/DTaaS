name: Commit Checks

'on':
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The commit-msg and gitleaks hooks run only where pre-commit is installed,
# and git commit --no-verify skips them, so both checks run again here over
# the commits of the pull request.
jobs:
  commit-messages:
    name: Commit Messages Credit No Coding Tool
    runs-on: ubuntu-latest
    timeout-minutes: &job_timeout 10
    steps:
      - name: Checkout code
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          lfs: false

      - name: Set up Python
        # v7.0.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'

      - name: Check each commit message
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          message_file="$(git rev-parse --absolute-git-dir)/CI_COMMIT_MSG"
          status=0
          for commit in $(git rev-list "${BASE_SHA}..${HEAD_SHA}"); do
            git log -1 --format=%B "$commit" > "$message_file"
            if ! python script/hooks/commit_msg_check.py "$message_file"; then
              echo "::error::commit $commit credits a coding tool as author"
              status=1
            fi
          done
          exit $status

  secrets:
    name: No Secrets in the New Commits
    runs-on: ubuntu-latest
    timeout-minutes: *job_timeout
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Checkout code
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          lfs: false

      # The release binary is checked against the published checksum
      # before it runs.
      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --proto '=https' --tlsv1.2 -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "$archive" gitleaks

      - name: Scan the commits of the pull request
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: ./gitleaks git --log-opts="${BASE_SHA}..${HEAD_SHA}" --redact --verbose
