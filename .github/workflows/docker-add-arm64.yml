# Adds a linux/arm64 image to a Docker image version that was published
# for linux/amd64 only, on both Docker Hub and GHCR, and keeps the
# published amd64 image as it is. See "Add arm64 to an Older Version" in
# docs/developer/contributions/docker.md for how to run and recover it.

name: Add arm64 to a published Docker image

'on':
  workflow_dispatch:
    inputs:
      image-name:
        description: Image to update
        required: true
        type: choice
        options: [dtaas-web, libms, logger-ms]
      version:
        description: Published version tag, for example 1.7.2
        required: true
        type: string
      source-ref:
        description: Commit the version was published from
        required: true
        type: string
      dockerfile:
        description: Dockerfile path at that commit
        required: true
        type: string
      node-version:
        description: Node.js version that built the dtaas-web website
        type: string
        default: '26'
      dry-run:
        description: Build and push by digest, but do not move any tag
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ inputs.image-name }}-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read  # Each job sets the permissions it needs

env:
  HUB_REPOSITORY: ${{ secrets.DOCKERHUB_SCOPE }}/${{ inputs.image-name }}
  VERSION: ${{ inputs.version }}

jobs:
  check:
    name: Check the published version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}  # Reads the public images anonymously
    outputs:
      ghcr_image: ${{ steps.check.outputs.ghcr_image }}
      ghcr_amd64: ${{ steps.check.outputs.ghcr_amd64 }}
      ghcr_latest: ${{ steps.check.outputs.ghcr_latest }}
      hub_amd64: ${{ steps.check.outputs.hub_amd64 }}
      hub_latest: ${{ steps.check.outputs.hub_latest }}

    steps:
      - name: Check that both registries hold an amd64-only version
        id: check
        env:
          GHCR_REPOSITORY: ${{ github.repository_owner }}/${{ inputs.image-name }}
          SOURCE_REF: ${{ inputs.source-ref }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ && "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "version must be X.Y.Z and source-ref a full 40-character commit SHA." >&2
            exit 1
          fi
          ACCEPT="application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json"
          ACCEPT="$ACCEPT,application/vnd.docker.distribution.manifest.v2+json,application/vnd.oci.image.manifest.v1+json"
          fetch() {  # <registry> <repository> <token> <path> [curl options]
            curl -sSfL --proto =https --proto-redir =https -H "Authorization: Bearer $3" \
              -H "Accept: $ACCEPT" "${@:5}" "https://$1/v2/$2/$4"
          }
          digest_of() {  # <registry> <repository> <token> <tag>
            fetch "$1" "$2" "$3" "manifests/$4" -I | tr -d '\r' |
              awk -F': ' 'tolower($1) == "docker-content-digest" { print $2 }'
          }
          check_registry() {  # <output prefix> <registry> <repository> <token>
            manifest=$(fetch "$2" "$3" "$4" "manifests/$VERSION")
            if [ "$(jq -r '.manifests != null' <<< "$manifest")" = true ]; then
              echo "$2/$3:$VERSION is already a multi-platform image." >&2
              exit 1
            fi
            config=$(fetch "$2" "$3" "$4" "blobs/$(jq -r '.config.digest' <<< "$manifest")")
            platform=$(jq -r '"\(.os)/\(.architecture)"' <<< "$config")
            if [ "$platform" != linux/amd64 ]; then
              echo "$2/$3:$VERSION is $platform, not linux/amd64." >&2
              exit 1
            fi
            amd64=$(digest_of "$2" "$3" "$4" "$VERSION")
            # Fail closed: only a 404 means there is no latest tag.
            code=$(fetch "$2" "$3" "$4" manifests/latest -I -o /dev/null -w '%{http_code}' || true)
            case "$code" in
              200) latest=$(digest_of "$2" "$3" "$4" latest) ;;
              404) latest="" ;;
              *) echo "Looking up $2/$3:latest returned HTTP $code." >&2; exit 1 ;;
            esac
            echo "$2/$3:$VERSION is linux/amd64 $amd64; latest is ${latest:-absent}."
            echo "${1}_amd64=$amd64" >> "$GITHUB_OUTPUT"
            echo "${1}_latest=$([ "$latest" = "$amd64" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          }
          ghcr_repo="${GHCR_REPOSITORY,,}"
          token=$(curl -sSf --proto =https "https://ghcr.io/token?scope=repository:$ghcr_repo:pull" | jq -r .token)
          check_registry ghcr ghcr.io "$ghcr_repo" "$token"
          echo "ghcr_image=ghcr.io/$ghcr_repo" >> "$GITHUB_OUTPUT"
          hub_auth="https://auth.docker.io/token?service=registry.docker.io"
          token=$(curl -sSf --proto =https "$hub_auth&scope=repository:$HUB_REPOSITORY:pull" | jq -r .token)
          check_registry hub registry-1.docker.io "$HUB_REPOSITORY" "$token"

  build-arm64:
    name: Build and push the arm64 image by digest
    needs: check
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read  # Required for checking out the code
      packages: write  # Push to github package registry
    env:
      IMAGES: ${{ needs.check.outputs.ghcr_image }},docker.io/${{ secrets.DOCKERHUB_SCOPE }}/${{ inputs.image-name }}
    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout the published commit
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source-ref }}
          lfs: false
          persist-credentials: false

      - name: Check that the commit and Dockerfile belong to the version
        env:
          IMAGE_NAME: ${{ inputs.image-name }}
          DOCKERFILE: ${{ inputs.dockerfile }}
        run: |
          case "$IMAGE_NAME" in
            dtaas-web) package=client expected=client.built.dockerfile ;;
            libms) package=servers/lib expected=libms.dockerfile ;;
            logger-ms) package=servers/logger expected=logger.dockerfile ;;
          esac
          found=$(jq -r .version "$package/package.json")
          if [ "$found" != "$VERSION" ] || [ "${DOCKERFILE##*/}" != "$expected" ] || [ ! -f "$DOCKERFILE" ]; then
            echo "Expected version $VERSION and a $expected; found $found and $DOCKERFILE." >&2
            exit 1
          fi

      - name: Setup node for building the React client website
        if: ${{ inputs.image-name == 'dtaas-web' }}
        # v7.0.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ inputs.node-version }}
          # No dependency cache in a publish job, so a poisoned cache entry
          # cannot reach a published image.
          package-manager-cache: false

      - name: Build react client website
        if: ${{ inputs.image-name == 'dtaas-web' }}
        run: |
          cd client/
          yarn install --frozen-lockfile --ignore-scripts --network-timeout 1000000
          yarn build

      - name: Set up Docker Buildx
        # v4.4.1
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Log in to GHCR
        # v4.6.0
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        # v4.6.0
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push the arm64 image by digest to both registries
        id: build
        # v7.4.0
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          platforms: linux/arm64
          outputs: type=image,"name=${{ env.IMAGES }}",push-by-digest=true,name-canonical=true,push=true

  merge:
    name: Point the version tag at amd64 and arm64
    needs: [check, build-arm64]
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write  # Push to github package registry

    steps:
      - name: Set up Docker Buildx
        # v4.4.1
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Log in to GHCR
        # v4.6.0
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        # v4.6.0
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create and push the multi-platform tags
        env:
          ARM64: ${{ needs.build-arm64.outputs.digest }}
          GHCR_IMAGE: ${{ needs.check.outputs.ghcr_image }}
          GHCR_AMD64: ${{ needs.check.outputs.ghcr_amd64 }}
          GHCR_LATEST: ${{ needs.check.outputs.ghcr_latest }}
          HUB_AMD64: ${{ needs.check.outputs.hub_amd64 }}
          HUB_LATEST: ${{ needs.check.outputs.hub_latest }}
        run: |
          merge() {  # <image> <amd64 digest> <move latest>
            tags=(--tag "$1:$VERSION")
            if [ "$3" = true ]; then
              tags+=(--tag "$1:latest")
            fi
            docker buildx imagetools create "${tags[@]}" "$1@$2" "$1@$ARM64"
            docker buildx imagetools inspect --raw "$1:$VERSION" |
              jq -e '[.manifests[].platform.architecture] | (index("amd64") != null and index("arm64") != null)'
          }
          merge "$GHCR_IMAGE" "$GHCR_AMD64" "$GHCR_LATEST"
          merge "docker.io/$HUB_REPOSITORY" "$HUB_AMD64" "$HUB_LATEST"
