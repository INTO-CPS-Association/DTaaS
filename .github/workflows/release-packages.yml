name: Release Packages

'on':
  push:
    paths:
      - 'deploy/dtaas/**'
      - 'deploy/workspace/**'
      - '.github/workflows/release-packages.yml'
  pull_request:
    paths:
      - 'deploy/dtaas/**'
      - 'deploy/workspace/**'
      - '.github/workflows/release-packages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-packages:
    name: Build and Upload Release Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout Repository
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          lfs: false

      # The packages carry their own diagrams, which are LFS objects. Only
      # deploy/ is fetched, not the documentation images and drawio canvases.
      - name: Fetch Git LFS objects of the packages
        run: |
          git lfs install --local
          git lfs pull --include="deploy/**"

      - name: Check that no package image is an LFS pointer
        run: |
          pointers=$(git ls-files -z 'deploy/**/*.png' \
            | xargs -0 grep -l --max-count=1 '^version https://git-lfs' || true)
          if [ -n "$pointers" ]; then
            echo "::error::LFS pointers instead of images:"
            echo "$pointers"
            exit 1
          fi

      - name: Upload dtaas-localhost
        # v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dtaas-localhost
          path: deploy/dtaas/docker/localhost
          if-no-files-found: error
          retention-days: 2

      - name: Upload dtaas-server
        # v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dtaas-server
          path: deploy/dtaas/docker/server
          if-no-files-found: error
          retention-days: 2

      - name: Upload dtaas-secure-server
        # v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dtaas-secure-server
          path: deploy/dtaas/docker/secure-server
          if-no-files-found: error
          retention-days: 2

      - name: Upload dtaas-secure-server-integrated-gitlab
        # v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dtaas-secure-server-integrated-gitlab
          path: deploy/dtaas/docker/secure-server_with_integrated-gitlab
          if-no-files-found: error
          retention-days: 2

      - name: Upload workspace-dex-localhost
        # v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: workspace-dex-localhost
          path: deploy/workspace/dex/localhost
          if-no-files-found: error
          retention-days: 2

      - name: Upload workspace-keycloak-production
        # v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: workspace-keycloak-production
          path: deploy/workspace/keycloak/production
          if-no-files-found: error
          retention-days: 2
