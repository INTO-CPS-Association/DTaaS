name: Release Packages

'on':
  push:
    paths:
      - 'deploy/dtaas/**'
      - 'deploy/workspace/**'
      - 'script/release-packages.sh'
      - '.github/workflows/release-packages.yml'
  pull_request:
    paths:
      - 'deploy/dtaas/**'
      - 'deploy/workspace/**'
      - 'script/release-packages.sh'
      - '.github/workflows/release-packages.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and Verify Release Packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout Repository
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          lfs: false

      - name: Fetch Git LFS assets
        # Package images are LFS-tracked; without this step the zips
        # would ship pointer files. Fetch only what the packages need.
        run: |
          git lfs install --local
          git lfs pull --include="deploy/dtaas/**,deploy/workspace/**"

      - name: Set package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ -n "$TAG" ]; then
            echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi

      - name: Build packages
        run: script/release-packages.sh build "$VERSION" dist

      - name: Verify packages
        run: script/release-packages.sh verify "$VERSION" dist

      - name: Upload packages
        # v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-packages
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 2

  publish:
    name: Attach Packages to Release
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download packages
        # v8.0.1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-packages
          path: dist

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/*.zip --clobber --repo "$GITHUB_REPOSITORY"
