name: CLI for DTaaS

on:
  push:
    paths:
      - 'cli/**'
  pull_request:
    paths:
      - 'cli/**'
  workflow_dispatch:


jobs:
  test-cli:
    uses: ./.github/workflows/python-reusable.yml
    with:
      working-directory: cli
      coverage-file: cli/coverage.xml
      artifact-name: dtaas-cli
      artifact-path: |
        cli/dist/*.whl
        cli/dist/*.tar.gz
