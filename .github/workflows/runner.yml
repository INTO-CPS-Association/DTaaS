name: Digital twin runner

'on':
  push:
    paths:
      - 'servers/execution/**'
      - '.github/workflows/runner.yml'
      - '.github/workflows/publish-npm.yml'
  pull_request:
    paths:
      - 'servers/execution/**'
      - '.github/workflows/runner.yml'
      - '.github/workflows/publish-npm.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 26

permissions:
  contents: read  # Required for checking out the code

jobs:
  test-runner:
    permissions:
      contents: read  # Required for checking out the code
    name: Test digital twin runner
    runs-on: ubuntu-latest
    timeout-minutes: &job_timeout 30
    defaults:
      run:
        working-directory: servers/execution/runner/

    steps:
      - name: Checkout
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup node
        # v7.0.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "yarn"
          cache-dependency-path: "**/yarn.lock"

      - name: Run linting and formatting checks on runner
        run: |
          npm install -g prettier
          yarn install
          yarn syntax
          prettier -c --ignore-path ../.gitignore "**/*.{ts,tsx,css,scss}"

      - name: Build the runner
        if: success() || failure()
        run: |
          yarn build

      - name: Run tests
        if: success() || failure()
        run: |
          yarn test

      - name: Upload test coverage to Codecov
        # v7.1.1
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: servers/execution/runner/coverage/clover.xml
          flags: dt-runner

  get-version:
    permissions:
      contents: read  # Required for checking out the code
    name: Get version and variables
    runs-on: ubuntu-latest
    timeout-minutes: *job_timeout
    steps:
      - name: Checkout Repository
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install jq
        run: sudo apt-get install -y jq
      - name: get version
        id: get-version
        run: |
          version=$(jq -r '.version' ./servers/execution/runner/package.json)
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "node-version=$NODE_VERSION" >> $GITHUB_OUTPUT
    outputs:
      version: ${{ steps.get-version.outputs.version }}
      node-version: ${{ steps.get-version.outputs.node-version }}

  publish-package-github:
    permissions:
      contents: read  # Required for checking out the code
      packages: write  # Push to github package registry

    if: |
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/feature/distributed-demo'

    name: Publish to GitHub Packages
    needs: [test-runner, get-version]
    uses: ./.github/workflows/publish-npm.yml
    with:
      node-version: ${{ needs.get-version.outputs.node-version }}
      registry-url: 'https://npm.pkg.github.com/'
      directory: servers/execution/runner
      package-name: >-
        ${{ vars.NPM_RUNNER_PACKAGE_NAME || '' }}
    secrets:
      NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-package-npm:
    permissions:
      contents: read  # Required for checking out the code
      packages: write  # Required by the publish-npm reusable workflow
    if: |
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/feature/distributed-demo'

    name: Publish to NPM
    needs: [get-version, test-runner]
    uses: ./.github/workflows/publish-npm.yml
    with:
      node-version: ${{ needs.get-version.outputs.node-version }}
      registry-url: 'https://registry.npmjs.org'
      directory: servers/execution/runner
      package-name: >-
        ${{ vars.NPM_RUNNER_PACKAGE_NAME || '' }}
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
