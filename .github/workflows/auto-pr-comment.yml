---
name: Auto PR Comment

'on':
  pull_request:
    types: [opened, synchronize]

jobs:
  comment:
    name: Post automatic comment on PR
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR diff
        id: pr-diff
        run: |
          # Get the base and head commits
          BASE_SHA=${{ github.event.pull_request.base.sha }}
          HEAD_SHA=${{ github.event.pull_request.head.sha }}

          # Get the diff and save to a file
          git diff $BASE_SHA..$HEAD_SHA > pr-diff.txt

          # Prepare the diff for use in the comment (escape and limit size)
          if [ -s pr-diff.txt ]; then
            echo "DIFF_EXISTS=true" >> $GITHUB_OUTPUT
            # Limit diff size to avoid comment size limits
            head -n 100 pr-diff.txt > pr-diff-limited.txt
            echo "DIFF_CONTENT<<EOF" >> $GITHUB_OUTPUT
            cat pr-diff-limited.txt >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "DIFF_EXISTS=false" >> $GITHUB_OUTPUT
          fi

      - name: Post a comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            <!-- Copilot Chat Review -->
            ## 🤖 Copilot Review

            ### Changes Overview
            This pull request contains the following changes:

            **Files changed:** ${{ github.event.pull_request.changed_files }}
            **Additions:** +${{ github.event.pull_request.additions }}
            **Deletions:** -${{ github.event.pull_request.deletions }}

            ### Code Review Notes
            ${{ steps.pr-diff.outputs.DIFF_EXISTS == 'true' &&
            '✅ Changes detected and ready for review' ||
            '⚠️ No changes detected in diff' }}

            ### Review Guidelines
            Please ensure:
            - [ ] Code follows the project's coding standards
            - [ ] All tests pass
            - [ ] Documentation is updated if needed
            - [ ] Breaking changes are properly documented

            ---
            *This comment was automatically generated by GitHub Actions.
            For detailed code analysis, please use GitHub Copilot Chat directly
            in your IDE.*
