name: Lint Miscellaneous Scripts

'on':
  push:
    paths:
      - '**.sh'
      - '**.py'
      - '**.yml'
      - '**.yaml'
      - '.shellcheckrc'
      - '.yamllint.yml'
      - '.agents/skills/**'
      - '.claude/skills/**'
      - '.github/workflows/lint-scripts.yml'
  pull_request:
    paths:
      - '**.sh'
      - '**.py'
      - '**.yml'
      - '**.yaml'
      - '.shellcheckrc'
      - '.yamllint.yml'
      - '.agents/skills/**'
      - '.claude/skills/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shellcheck:
    name: Lint Shell Scripts
    runs-on: ubuntu-latest
    timeout-minutes: &job_timeout 30
    permissions:
      contents: read
    steps:
      - name: Checkout code
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          lfs: false

      - name: Run ShellCheck
        # 2.0.0
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38
        with:
          severity: warning
          format: gcc

  python-lint:
    name: Lint Python Scripts
    runs-on: ubuntu-latest
    timeout-minutes: *job_timeout
    permissions:
      contents: read
    steps:
      - name: Checkout code
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          lfs: false

      - name: Set up Python
        # v7.0.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pylint

      - name: Run flake8
        run: |
          flake8 cli/ servers/ script/ deploy/services/cli/ deploy/workspace/ \
            --count --select=E9,F63,F7,F82 --show-source \
            --statistics \
            --exclude=venv,.venv,__pycache__,.git || \
            echo "No Python files to lint"
          flake8 cli/ servers/ script/ deploy/services/cli/ \
            --count --max-complexity=10 --max-line-length=127 \
            --statistics \
            --exclude=venv,.venv,__pycache__,.git || \
            echo "No Python files to lint"

      - name: Run pylint
        run: |
          pylint cli/ servers/ script/ deploy/services/cli/ deploy/workspace/ \
            --rcfile='${{ github.workspace }}/.pylintrc' \
            --fail-under=9 --recursive=y || echo "No Python files to lint"

  javascript-lint:
    name: Lint and Test Node Scripts (${{ matrix.skill }})
    runs-on: ubuntu-latest
    timeout-minutes: *job_timeout
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        skill: [upgrade-npm-packages, capture-docs-screenshots]
    defaults:
      run:
        working-directory: .agents/skills/${{ matrix.skill }}/scripts
    steps:
      - name: Checkout code
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          lfs: false

      - name: Setup node
        # v7.0.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26'

      # The scripts have no npm dependencies; the linters are installed
      # here only, at exact versions, without a package.json.
      - name: Install linting tools
        run: |
          npm install --no-save --no-package-lock --ignore-scripts \
            eslint@10.11.0 @eslint/js@10.0.1 prettier@3.9.9

      - name: Run eslint
        run: node_modules/.bin/eslint .

      - name: Run prettier
        run: node_modules/.bin/prettier --check .

      - name: Run unit tests
        run: node --test ./*.test.js

      # Claude Code reads .claude/skills, so every skill keeps a stub there
      # whose frontmatter must match the canonical .agents/skills copy. The
      # check covers every skill, so one matrix leg runs it.
      - name: Check Claude Code skill stubs
        if: matrix.skill == 'upgrade-npm-packages'
        working-directory: .
        run: |
          frontmatter() { local file="$1"; awk '/^---$/ { n++; next } n == 1' "$file"; }
          status=0
          for skill in .agents/skills/*/; do
            name=$(basename "$skill")
            stub=".claude/skills/$name/SKILL.md"
            if [ ! -f "$stub" ]; then
              echo "::error file=$stub::missing Claude Code stub for $name"
              status=1
            elif ! diff <(frontmatter "$skill/SKILL.md") <(frontmatter "$stub"); then
              echo "::error file=$stub::frontmatter differs from $skill/SKILL.md"
              status=1
            fi
          done
          exit $status

  python-skill-tests:
    name: Test Python Skill Scripts (${{ matrix.skill }})
    runs-on: ubuntu-latest
    timeout-minutes: *job_timeout
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        skill: [update-docs-diagrams]
    defaults:
      run:
        working-directory: .agents/skills/${{ matrix.skill }}/scripts
    steps:
      - name: Checkout code
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          lfs: false

      - name: Set up Python
        # v7.0.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'

      # The tests use the standard library only, so nothing is installed.
      - name: Run unit tests
        run: python -m unittest discover --pattern 'test_*.py' --verbose

  python-script-tests:
    name: Test Git Hook Scripts
    runs-on: ubuntu-latest
    timeout-minutes: *job_timeout
    permissions:
      contents: read
    defaults:
      run:
        working-directory: script/hooks
    steps:
      - name: Checkout code
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          lfs: false

      - name: Set up Python
        # v7.0.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'

      # The tests use the standard library only, so nothing is installed.
      - name: Run unit tests
        run: python -m unittest discover --pattern 'test_*.py' --verbose

  yaml-lint:
    name: Lint YAML Files
    runs-on: ubuntu-latest
    timeout-minutes: *job_timeout
    permissions:
      contents: read
    steps:
      - name: Checkout code
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          lfs: false

      - name: Set up Python
        # v7.0.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'

      - name: Install yamllint
        run: |
          python -m pip install --upgrade pip
          pip install yamllint

      - name: Run yamllint
        run: |
          yamllint .
