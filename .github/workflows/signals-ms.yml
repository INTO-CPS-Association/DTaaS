name: Signals microservice

'on':
  push:
    paths:
      - 'servers/signals/**'
      - 'developer/check/signals.dockerfile'
      - '.github/workflows/signals-ms.yml'
  pull_request:
    paths:
      - 'servers/signals/**'
      - 'developer/check/signals.dockerfile'
      - '.github/workflows/signals-ms.yml'
      - '.github/workflows/docker-build.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded pull request runs.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: 26
  SIGNALS_PORT: 4004

permissions:
  contents: read

jobs:
  # The npm package and the Docker image are not published yet, as the
  # maintainer asked in #1913. The jobs check the build and the image only.
  test-signals-ms:
    permissions:
      contents: read
    name: Test signals microservice
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: servers/signals

    steps:
      - name: Checkout
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup node
        # v7.0.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'
          cache-dependency-path: '**/yarn.lock'

      - name: Run linting and formatting checks
        run: |
          YARN_ENABLE_SCRIPTS=false yarn install --frozen-lockfile --ignore-scripts
          yarn syntax:check
          yarn format:check

      - name: Build the signals microservice
        run: |
          yarn build

      - name: Run tests
        run: |
          yarn test

      - name: Run integration tests against RabbitMQ
        run: |
          yarn test:int

      - name: Upload test coverage to Codecov
        # v7.1.1
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: servers/signals/coverage/clover.xml
          flags: signals-microservice-tests

      - name: Check signals microservice health
        env:
          NODE_NO_WARNINGS: '1'
          NODE_OPTIONS: >-
            --es-module-specifier-resolution=node
            --experimental-specifier-resolution=node
          PORT: ${{ env.SIGNALS_PORT }}
        run: |
          yarn build
          node dist/src/main.js > signals-ms.log 2>&1 &
          signals_pid="$!"
          trap 'kill "$signals_pid" 2>/dev/null || true' EXIT
          for _ in 1 2 3 4; do
            if curl -f -LI "http://localhost:${PORT}/signals/health"; then
              exit 0
            fi
            if ! kill -0 "$signals_pid" 2>/dev/null; then
              cat signals-ms.log
              exit 1
            fi
            sleep 10
          done
          cat signals-ms.log
          exit 1

      - name: Build and check signals Docker image
        working-directory: ${{ github.workspace }}
        run: |
          docker build \
            --file developer/check/signals.dockerfile \
            --tag dtaas-signals-ms:ci \
            .
          container_id=$(docker run --detach --rm \
            --publish 127.0.0.1:4004:4004 \
            dtaas-signals-ms:ci)
          trap 'docker logs "$container_id"; docker stop "$container_id"' EXIT
          for _ in 1 2 3 4; do
            if curl --fail --silent --show-error \
              http://127.0.0.1:4004/signals/health; then
              exit 0
            fi
            sleep 3
          done
          exit 1

  build-docker-image:
    name: Build Docker image
    permissions:
      contents: read
    uses: ./.github/workflows/docker-build.yml
    with:
      image-name: signals-ms
      dockerfile: signals.dockerfile
