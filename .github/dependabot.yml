version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/client"
    schedule:
      interval: "weekly"
      day: "sunday"
    assignees:
      - "prasadtalasila"
    commit-message:
      prefix: "client-npm: "
    target-branch: "dependabot-merge"
    pull-request-branch-name:
      separator: "-"
    cooldown:
      default-days: 3

  - package-ecosystem: "npm"
    directory: "/servers/lib"
    schedule:
      interval: "weekly"
      day: "sunday"
    assignees:
      - "prasadtalasila"
    commit-message:
      prefix: "libms-npm: "
    target-branch: "dependabot-merge"
    pull-request-branch-name:
      separator: "-"
    cooldown:
      default-days: 3
    ignore:
      # jest is pinned to ~30.4.2; see servers/lib/DEVELOPER.md
      - dependency-name: "jest"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"

  - package-ecosystem: "npm"
    directory: "/servers/logger"
    schedule:
      interval: "weekly"
      day: "sunday"
    assignees:
      - "prasadtalasila"
    commit-message:
      prefix: "logger-npm: "
    target-branch: "dependabot-merge"
    pull-request-branch-name:
      separator: "-"
    cooldown:
      default-days: 3

  - package-ecosystem: "npm"
    directory: "/servers/execution/runner"
    schedule:
      interval: "weekly"
      day: "sunday"
    assignees:
      - "prasadtalasila"
    commit-message:
      prefix: "runner-npm: "
    target-branch: "dependabot-merge"
    pull-request-branch-name:
      separator: "-"
    cooldown:
      default-days: 3

  # The image and font tools of the update-docs-diagrams agent skill, pinned
  # with hashes. A release waits ten days, as for every tool the diagrams use.
  - package-ecosystem: "pip"
    directory: "/.agents/skills/update-docs-diagrams/scripts"
    schedule:
      interval: "weekly"
      day: "sunday"
    assignees:
      - "prasadtalasila"
    commit-message:
      prefix: "diagrams-pip: "
    target-branch: "dependabot-merge"
    pull-request-branch-name:
      separator: "-"
    cooldown:
      default-days: 10
