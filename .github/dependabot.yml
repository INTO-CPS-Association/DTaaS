version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/client"
    schedule:
      interval: "weekly"
      day: "sunday"
    assignees:
      - "prasadtalasila"
    commit-message:
      prefix: "client-npm: "
    target-branch: "dependabot-merge"
    pull-request-branch-name:
      separator: "-"

  - package-ecosystem: "npm"
    directory: "/servers/lib"
    schedule:
      interval: "weekly"
      day: "sunday"
    assignees:
      - "prasadtalasila"
    commit-message:
      prefix: "libms-npm: "
    target-branch: "dependabot-merge"
    pull-request-branch-name:
      separator: "-"
    ignore:
      # jest is pinned to ~30.4.2; see servers/lib/DEVELOPER.md
      - dependency-name: "jest"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"

  - package-ecosystem: "npm"
    directory: "/servers/logger"
    schedule:
      interval: "weekly"
      day: "sunday"
    assignees:
      - "prasadtalasila"
    commit-message:
      prefix: "logger-npm: "
    target-branch: "dependabot-merge"
    pull-request-branch-name:
      separator: "-"

  - package-ecosystem: "npm"
    directory: "/servers/execution/runner"
    schedule:
      interval: "weekly"
      day: "sunday"
    assignees:
      - "prasadtalasila"
    commit-message:
      prefix: "runner-npm: "
    target-branch: "dependabot-merge"
    pull-request-branch-name:
      separator: "-"
