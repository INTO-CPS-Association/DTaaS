services:
  traefik:
    image: traefik:v2.10
    restart: unless-stopped
    command: 
      - "--log.level=DEBUG"
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--entryPoints.web.address=:80"
      - "--entrypoints.web.forwardedHeaders.insecure=true"
      - "--entrypoints.web.proxyProtocol.insecure=true"
    ports:
      - "80:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - frontend
      - users

  client:
    image: intocps/dtaas-web:latest
    restart: unless-stopped
    volumes:
      - ${DTAAS_DIR}/deploy/config/client/env.local.js:/dtaas/client/build/env.js
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.client.entryPoints=web"
      - "traefik.http.services.client.loadbalancer.server.port=4000"
      - "traefik.http.routers.client.rule=PathPrefix(`/`)"
    networks:
      - frontend

  logger-ms:
    image: intocps/logger-ms:latest
    restart: unless-stopped
    volumes:
      - ${DTAAS_DIR}/files:/dtaas/logger/logs
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.logger-ms.entryPoints=web"
      - "traefik.http.services.logger-ms.loadbalancer.server.port=4003"
      - "traefik.http.routers.logger-ms.rule=PathPrefix(`/logger`)"
    networks:
      - frontend

  user1:
    image: intocps/workspace:latest
    restart: unless-stopped
    volumes:
      - ${DTAAS_DIR}/files/common:/workspace/common
      - ${DTAAS_DIR}/files/${username1}:/workspace
    environment:
      - AUTHENTICATE_VIA_JUPYTER=
      - WORKSPACE_BASE_URL=${username1}
    shm_size: "512m"
    cpus: 4
    mem_limit: "4G"
    pids_limit: 4960
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.u1.entryPoints=web"
      - "traefik.http.routers.u1.rule=PathPrefix(`/${username1}`) "
    networks:
      - users

networks:
  frontend:
    name: dtaas-frontend
  users:
    name: dtaas-users
