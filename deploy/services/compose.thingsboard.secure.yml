
services:
  postgres:
    image: 'postgres:16.11'
    container_name: postgres
    restart: always
    ports:
      - '${POSTGRES_PORT}:5432'
    volumes:
      - './data/postgres:/var/lib/postgresql/data'
      # Mount certs read-only and copy into container to ensure correct POSIX permissions.
      # This avoids restart loops on Windows bind mounts where postgres.key appears world-readable.
      - './certs/${HOSTNAME}:/certs-src:ro'
    environment:
      POSTGRES_DB: '${POSTGRES_DB}'
      POSTGRES_USER: '${POSTGRES_USER}'
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD}'
    entrypoint:
      - bash
      - -c
      - |
        set -e
        if [ ! -f /certs-src/postgres.crt ] || [ ! -f /certs-src/postgres.key ]; then
          echo "Missing /certs-src/postgres.crt or /certs-src/postgres.key. Run: dtaas-services setup" >&2
          exit 1
        fi

        mkdir -p /var/lib/postgresql/ssl
        cp /certs-src/postgres.crt /var/lib/postgresql/ssl/postgres.crt
        cp /certs-src/postgres.key /var/lib/postgresql/ssl/postgres.key

        chown postgres:postgres /var/lib/postgresql/ssl/postgres.crt /var/lib/postgresql/ssl/postgres.key
        chmod 644 /var/lib/postgresql/ssl/postgres.crt
        chmod 600 /var/lib/postgresql/ssl/postgres.key

        exec docker-entrypoint.sh postgres \
          -c ssl=on \
          -c ssl_cert_file=/var/lib/postgresql/ssl/postgres.crt \
          -c ssl_key_file=/var/lib/postgresql/ssl/postgres.key
    networks:
      - platform-services

  thingsboard-ce:
    image: 'thingsboard/tb-node:4.2.1'
    container_name: thingsboard
    restart: always
    ports:
      - '${THINGSBOARD_PORT}:8080'
      - '${THINGSBOARD_EDGE_RPC_PORT}:7070'
      - '${THINGSBOARD_MQTT_PORT}:1883'
      - '${THINGSBOARD_MQTT_SSL_PORT}:8883'
      - '${THINGSBOARD_COAP_LwM2M_PORTS}:5683-5688/udp'
    volumes:
      - './log/thingsboard:/var/log/thingsboard'
      - './data/thingsboard:/data'
      - './certs/${HOSTNAME}:/certs'
    environment:
      TB_SERVICE_ID: tb-ce-node
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}?sslmode=require
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SSL_ENABLED: "true"
      SSL_CREDENTIALS_TYPE: "PEM"
      SSL_PEM_CERT: "/certs/thingsboard-fullchain.pem"
      SSL_PEM_KEY: "/certs/thingsboard-privkey.pem"
    logging:
      driver: 'json-file'
      options:
        max-size: '100m'
        max-file: '10'
    depends_on:
      - postgres
    networks:
      - platform-services

networks:
  platform-services:
    name: dtaas-platform-services
