# Agent settings of the Telegraf that writes the history of signals.
# Each twin has its own file in telegraf.d, made by dtaas-services twin
# register. Do not add twin plugins here.

[agent]
  omit_hostname = true
  # No processors or aggregators are used. This is the coming default.
  skip_processors_after_aggregators = true

# Telegraf refuses to start without an input and an output. These two keep
# it running before the first twin is registered. Twin outputs accept only
# their own routing tag, so the internal metrics never reach a database.
[[inputs.internal]]
  collect_memstats = false

[[outputs.discard]]
  namepass = ["internal*"]
