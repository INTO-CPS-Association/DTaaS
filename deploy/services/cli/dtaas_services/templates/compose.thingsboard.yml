services:
  thingsboard-ce:
    image: 'thingsboard/tb-node:4.3.1.6'
    container_name: thingsboard
    restart: always
    user: root
    ports:
      - '${THINGSBOARD_PORT}:8080'
      - '${THINGSBOARD_EDGE_RPC_PORT}:7070'
      - '${THINGSBOARD_MQTT_PORT}:1883'
      - '${THINGSBOARD_MQTT_SSL_PORT}:8883'
      - '${THINGSBOARD_COAP_LwM2M_PORTS}:5683-5688/udp'
    volumes:
      - './log/thingsboard:/var/log/thingsboard'
      - './data/thingsboard:/data'
      - './certs:/certs:ro'
    environment:
      TB_SERVICE_ID: tb-ce-node
      # yamllint disable-line rule:line-length
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}?sslmode=require
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SSL_ENABLED: "true"
      SSL_CREDENTIALS_TYPE: "PEM"
      SSL_PEM_CERT: "/certs/thingsboard-fullchain.pem"
      SSL_PEM_KEY: "/certs/thingsboard-privkey.pem"
      # MQTT over TLS for devices, with the same certificate as the web API.
      MQTT_SSL_ENABLED: "true"
      MQTT_SSL_CREDENTIALS_TYPE: "PEM"
      MQTT_SSL_PEM_CERT: "/certs/thingsboard-fullchain.pem"
      MQTT_SSL_PEM_KEY: "/certs/thingsboard-privkey.pem"
      # What the "Check connectivity" page of a device tells it to use. The
      # defaults name the ports inside the container, which a device outside
      # cannot reach, so the page names the published ports instead.
      DEVICE_CONNECTIVITY_HTTP_ENABLED: "false"
      DEVICE_CONNECTIVITY_HTTPS_ENABLED: "true"
      DEVICE_CONNECTIVITY_HTTPS_PORT: "${THINGSBOARD_PORT}"
      DEVICE_CONNECTIVITY_MQTT_ENABLED: "false"
      DEVICE_CONNECTIVITY_MQTTS_ENABLED: "true"
      DEVICE_CONNECTIVITY_MQTTS_PORT: "${THINGSBOARD_MQTT_SSL_PORT}"
    logging:
      driver: 'json-file'
      options:
        max-size: '100m'
        max-file: '10'
    networks:
      - platform-services

networks:
  platform-services:
    name: dtaas-services
