services:
  traefik:
    image: traefik:v3.6.13
    restart: unless-stopped
    command:
      - "--log.level=INFO"
      - "--api.insecure=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entryPoints.web.address=:80"
      - "--entrypoints.web-secure.address=:443"
      - "--entrypoints.web.http.redirections.entryPoint.to=web-secure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      - "--entrypoints.web.http.redirections.entrypoint.permanent=true"
      - "--providers.file.directory=/etc/traefik"
      - "--providers.file.watch=true"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./config/tls.yml:/etc/traefik/tls.yml"
      - "./certs:/etc/traefik-certs"
    networks:
      - frontend
      - users

  client:
    image: intocps/dtaas-web:1.0.2
    restart: unless-stopped
    volumes:
      - "./config/client.js:/dtaas/client/build/env.js"
    labels:
      - "traefik.enable=true"
      - >-
        traefik.http.routers.client.rule=Host(`${SERVER_DNS:-localhost}`)
        && PathPrefix(`/`)
      - "traefik.http.routers.client.tls=true"
      - "traefik.http.services.client.loadbalancer.server.port=4000"
    networks:
      - frontend

  user:
    image: intocps/workspace:main-967bc10
    restart: unless-stopped
    environment:
      - MAIN_USER=${USERNAME:-user1}
    volumes:
      - "./files/common:/workspace/common"
      - "./files/${USERNAME:-user1}:/workspace"
    labels:
      - "traefik.enable=true"
      - >-
        traefik.http.routers.user.rule=Host(`${SERVER_DNS:-localhost}`)
        && PathPrefix(`/${USERNAME:-user1}`)
      - "traefik.http.routers.user.tls=true"
    networks:
      - users

networks:
  frontend:
    name: dtaas-frontend
  users:
    name: dtaas-users
