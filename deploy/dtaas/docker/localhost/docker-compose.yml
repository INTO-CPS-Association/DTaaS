services:
  traefik:
    image: traefik:v3.7.14
    restart: unless-stopped
    command:
      - "--log.level=INFO"
      - "--api.insecure=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entryPoints.web.address=:80"
      - "--entrypoints.web.forwardedHeaders.insecure=true"
      - "--entrypoints.web.proxyProtocol.insecure=true"
    ports:
      - "80:80"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"

  client:
    image: intocps/dtaas-web:1.7.1
    restart: unless-stopped
    volumes:
      - "./config/client.js:/dtaas/client/build/env.js"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.client.entryPoints=web"
      - "traefik.http.services.client.loadbalancer.server.port=4000"
      - "traefik.http.routers.client.rule=PathPrefix(`/`)"

  logger-ms:
    image: intocps/logger-ms:0.1.2
    restart: unless-stopped
    volumes:
      - "./logs/logger:/dtaas/logger/logs"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.logger-ms.entryPoints=web"
      - "traefik.http.services.logger-ms.loadbalancer.server.port=4003"
      - "traefik.http.routers.logger-ms.rule=PathPrefix(`/logger`)"
      - "traefik.http.routers.logger-ms.priority=100"

  # The signals gateway, started only with the "signals" profile because it
  # needs config/signals.yaml and the three files of config/secrets/,
  # described in CONFIG.md.
  signals:
    image: intocps/signals-ms:0.1.0
    restart: unless-stopped
    profiles:
      - signals
    volumes:
      - "./config/signals.yaml:/dtaas/signals/signals.yaml:ro"
    # Each secret is mounted read-only at /run/secrets/<name>, where
    # signals.yaml names it
    secrets:
      - rabbitmq_dtaas_signals_password
      - postgresql_dtaas_signals_ro_password
      - signals_owners.json
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.signals.entryPoints=web"
      - "traefik.http.services.signals.loadbalancer.server.port=4004"
      - "traefik.http.routers.signals.rule=PathPrefix(`/signals`)"
      - "traefik.http.routers.signals.priority=100"

  user:
    image: intocps/workspace:main-56c6f68
    restart: unless-stopped
    volumes:
      - "./files/common:/workspace/common"
      - "./files/${DEFAULT_USER:-user1}:/workspace"
    environment:
      - MAIN_USER=${DEFAULT_USER:-user1}
    shm_size: "512m"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.user.entryPoints=web"
      - "traefik.http.routers.user.rule=PathPrefix(`/${DEFAULT_USER:-user1}`)"

secrets:
  rabbitmq_dtaas_signals_password:
    file: ./config/secrets/rabbitmq_dtaas_signals_password
  postgresql_dtaas_signals_ro_password:
    file: ./config/secrets/postgresql_dtaas_signals_ro_password
  signals_owners.json:
    file: ./config/secrets/signals_owners.json
