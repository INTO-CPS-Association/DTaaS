services:
  traefik:
    image: traefik:v3.7.14
    restart: unless-stopped
    command:
      - "--log.level=INFO"
      - "--api.insecure=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entryPoints.web.address=:80"
      - "--entrypoints.web-secure.address=:443"
      - "--entrypoints.web.http.redirections.entryPoint.to=web-secure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      - "--entrypoints.web.http.redirections.entrypoint.permanent=true"
      - "--providers.file.directory=/etc/traefik"
      - "--providers.file.watch=true"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./config/tls.yml:/etc/traefik/tls.yml"
      - "./certs:/etc/traefik-certs"
    networks:
      - frontend
      - users

  client:
    image: intocps/dtaas-web:1.7.1
    restart: unless-stopped
    volumes:
      - "./config/client.js:/dtaas/client/build/env.js"
    labels:
      - "traefik.enable=true"
      - >-
        traefik.http.routers.client.rule=Host(`${SERVER_DNS:-localhost}`)
        && PathPrefix(`/`)
      - "traefik.http.routers.client.tls=true"
      - "traefik.http.routers.client.middlewares=traefik-forward-auth,client-headers"
      - "traefik.http.services.client.loadbalancer.server.port=4000"
      # Security headers of the website. The monaco-editor prefix is where
      # the editor of the Digital Twins page loads itself from, and
      # 'wasm-unsafe-eval' lets the Buildings page start its IFC parser.
      - >-
        traefik.http.middlewares.client-headers.headers.contentSecurityPolicy=default-src
        'self';
        script-src 'self' 'wasm-unsafe-eval' https://cdn.jsdelivr.net/npm/monaco-editor@0.55.1/;
        style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net/npm/monaco-editor@0.55.1/;
        font-src 'self' data: https://cdn.jsdelivr.net/npm/monaco-editor@0.55.1/;
        img-src 'self' data: blob: https:;
        connect-src 'self' ${OAUTH_URL}/ blob: data:;
        worker-src 'self' blob:;
        frame-src 'self'; frame-ancestors 'self';
        object-src 'none'; base-uri 'self'
      - "traefik.http.middlewares.client-headers.headers.contentTypeNosniff=true"
      - >-
        traefik.http.middlewares.client-headers.headers.referrerPolicy=strict-origin-when-cross-origin
      - "traefik.http.middlewares.client-headers.headers.customFrameOptionsValue=SAMEORIGIN"
      - "traefik.http.middlewares.client-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.common-headers.headers.contentTypeNosniff=true"
      - >-
        traefik.http.middlewares.common-headers.headers.referrerPolicy=strict-origin-when-cross-origin
      - "traefik.http.middlewares.common-headers.headers.stsSeconds=31536000"
    networks:
      - frontend

  logger-ms:
    image: intocps/logger-ms:0.1.2
    restart: unless-stopped
    volumes:
      - "./logs/logger:/dtaas/logger/logs"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.logger-ms.entryPoints=web-secure"
      - "traefik.http.services.logger-ms.loadbalancer.server.port=4003"
      - >-
        traefik.http.routers.logger-ms.rule=Host(`${SERVER_DNS:-localhost}`)
        && PathPrefix(`/logger`)
      - "traefik.http.routers.logger-ms.tls=true"
      - "traefik.http.routers.logger-ms.middlewares=traefik-forward-auth,common-headers"
      - "traefik.http.routers.logger-ms.priority=100"
    networks:
      - frontend

  # The signals gateway, started only with the "signals" profile because it
  # needs its configuration and two secret files, described in CONFIG.md.
  signals:
    image: intocps/signals-ms:0.1.0
    restart: unless-stopped
    profiles:
      - signals
    volumes:
      - "./config/signals.yaml:/dtaas/signals/signals.yaml:ro"
    secrets:
      - signals-rabbitmq-password
      - signals-influx-tokens
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.signals.entryPoints=web-secure"
      - "traefik.http.services.signals.loadbalancer.server.port=4004"
      - >-
        traefik.http.routers.signals.rule=Host(`${SERVER_DNS:-localhost}`)
        && PathPrefix(`/signals`)
      - "traefik.http.routers.signals.tls=true"
      - "traefik.http.routers.signals.middlewares=traefik-forward-auth,common-headers"
      - "traefik.http.routers.signals.priority=100"
    networks:
      - frontend

  user1:
    image: intocps/workspace:main-56c6f68
    restart: unless-stopped
    environment:
      - MAIN_USER=${USERNAME1:-user1}
    volumes:
      - "./files/common:/workspace/common"
      - "./files/${USERNAME1:-user1}:/workspace"
    labels:
      - "traefik.enable=true"
      - >-
        traefik.http.routers.u1.rule=Host(`${SERVER_DNS:-localhost}`)
        && PathPrefix(`/${USERNAME1:-user1}`)
      - "traefik.http.routers.u1.tls=true"
      - "traefik.http.routers.u1.middlewares=traefik-forward-auth,common-headers"
    networks:
      - users

  user2:
    image: intocps/workspace:main-56c6f68
    restart: unless-stopped
    environment:
      - MAIN_USER=${USERNAME2:-user2}
    volumes:
      - "./files/common:/workspace/common"
      - "./files/${USERNAME2:-user2}:/workspace"
    labels:
      - "traefik.enable=true"
      - >-
        traefik.http.routers.u2.rule=Host(`${SERVER_DNS:-localhost}`)
        && PathPrefix(`/${USERNAME2:-user2}`)
      - "traefik.http.routers.u2.tls=true"
      - "traefik.http.routers.u2.middlewares=traefik-forward-auth,common-headers"
    networks:
      - users

  libms:
    image: intocps/libms:0.5.13
    restart: unless-stopped
    volumes:
      - ./files/common:/dtaas/libms/files
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.libms.loadbalancer.server.port=4001"
      - >-
        traefik.http.routers.libms.rule=Host(`${SERVER_DNS:-localhost}`)
        && PathPrefix(`/lib`)
      - "traefik.http.routers.libms.tls=true"
      - "traefik.http.routers.libms.middlewares=traefik-forward-auth,common-headers"
    networks:
      - frontend

  traefik-forward-auth:
    image: thomseddon/traefik-forward-auth:latest
    restart: unless-stopped
    volumes:
      - "./config/conf.server:/conf"
    environment:
      - LOG_LEVEL=info
      - DEFAULT_PROVIDER=generic-oauth
      - PROVIDERS_GENERIC_OAUTH_AUTH_URL=${OAUTH_URL}/oauth/authorize
      - PROVIDERS_GENERIC_OAUTH_TOKEN_URL=http://gitlab/gitlab/oauth/token
      - PROVIDERS_GENERIC_OAUTH_USER_URL=http://gitlab/gitlab/api/v4/user
      - PROVIDERS_GENERIC_OAUTH_CLIENT_ID=${OAUTH_CLIENT_ID}
      - PROVIDERS_GENERIC_OAUTH_CLIENT_SECRET=${OAUTH_CLIENT_SECRET}
      - PROVIDERS_GENERIC_OAUTH_SCOPE=read_user
      - SECRET=${OAUTH_SECRET}
      - CONFIG=/conf
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.redirect.entryPoints=web-secure"
      - >-
        traefik.http.routers.redirect.rule=Host(`${SERVER_DNS:-localhost}`)
        && PathPrefix(`/_oauth`)
      - "traefik.http.routers.redirect.middlewares=traefik-forward-auth"
      - >-
        traefik.http.middlewares.traefik-forward-auth.forwardauth.address=http://traefik-forward-auth:4181
      - >-
        traefik.http.middlewares.traefik-forward-auth.forwardauth.authResponseHeaders=X-Forwarded-User
      - >-
        traefik.http.services.traefik-forward-auth.loadbalancer.server.port=4181
    networks:
      - frontend
      - users

  gitlab:
    image: 'gitlab/gitlab-ce:19.2.0-ce.0'
    container_name: gitlab
    restart: always
    hostname: ${SERVER_DNS}
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'https://${SERVER_DNS}/gitlab'
        gitlab_rails['gitlab_shell_ssh_port'] = 2424
        nginx['listen_port'] = 80
        nginx['enable'] = true
        nginx['listen_https'] = false
        nginx['redirect_http_to_https'] = false
        letsencrypt['enable'] = false
    volumes:
      - './config/gitlab:/etc/gitlab'
      - './logs:/var/log/gitlab'
      - './data:/var/opt/gitlab'
    shm_size: '256m'
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gitlab.entryPoints=web-secure"
      - >-
        traefik.http.routers.gitlab.rule=Host(`${SERVER_DNS:-localhost}`)
        && PathPrefix(`/gitlab`)
      - "traefik.http.routers.gitlab.service=gitlab"
      - "traefik.http.services.gitlab.loadbalancer.server.port=80"
      - "traefik.http.routers.gitlab.tls=true"
    networks:
      - frontend

secrets:
  signals-rabbitmq-password:
    file: ./config/secrets/rabbitmq-password
  signals-influx-tokens:
    file: ./config/secrets/influx-tokens.json

networks:
  frontend:
    name: dtaas-frontend
  users:
    name: dtaas-users
