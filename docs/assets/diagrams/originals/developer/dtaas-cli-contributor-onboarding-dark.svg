<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 840 984" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dtaas-cli-contributor-onboarding-dark-title dtaas-cli-contributor-onboarding-dark-desc" id="dtaas-cli-contributor-onboarding-dark-root">
        <title id="dtaas-cli-contributor-onboarding-dark-title">Contribute to the dtaas CLI</title>
        <desc id="dtaas-cli-contributor-onboarding-dark-desc">Onboarding flow for a dtaas CLI contributor: open the repository, install with Poetry, vendor the deploy templates and gitlab_common with build.py, read the code, re-vendor after changing shared code, then run pytest, pylint and pyright and open a pull request.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #dtaas-cli-contributor-onboarding-dark-root { --color-paper:   #1e2229;
      --color-ink:     rgb(232,236,243);
      --color-muted:   #a9b3c6;
      --color-accent:  #00aba4;
      --font-sans:     'Inter', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #dtaas-cli-contributor-onboarding-dark-root { font-family: var(--font-sans); color: var(--color-ink); }
      #dtaas-cli-contributor-onboarding-dark-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#dtaas-cli-contributor-onboarding-dark-root .diagram-container { overflow-x: visible; }
}</style>
