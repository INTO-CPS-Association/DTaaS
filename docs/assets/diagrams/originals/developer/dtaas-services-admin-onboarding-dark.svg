        <rect x="60" y="352" width="340" height="64" rx="6" fill="#1a353a" stroke="#00aba4" stroke-width="1.2"/>
        <text x="230" y="379" fill="rgb(232,236,243)" font-size="16" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Prepare the host</text>
        <text x="230" y="399" fill="#a9b3c6" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">sudo -E dtaas-services host setup</text>
        <rect x="60" y="456" width="340" height="64" rx="6" fill="#1e2229"/>
