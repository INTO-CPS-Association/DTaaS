        <polygon points="230,560 370,616 230,672 90,616" fill="#262b34" stroke="rgb(232,236,243)" stroke-width="1.2"/>
        <text x="230" y="611" fill="rgb(232,236,243)" font-size="16" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">ThingsBoard</text>
        <text x="230" y="631" fill="rgb(232,236,243)" font-size="16" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">or GitLab?</text>
        <rect x="60" y="712" width="340" height="64" rx="6" fill="#1e2229"/>
        <rect x="60" y="712" width="340" height="64" rx="6" fill="#262b34" stroke="rgb(232,236,243)" stroke-width="1.2"/>
        <text x="230" y="739" fill="rgb(232,236,243)" font-size="16" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Add users</text>
        <text x="230" y="759" fill="#a9b3c6" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">user add</text>
        <rect x="60" y="816" width="340" height="64" rx="28" fill="#1e2229"/>
        <rect x="60" y="816" width="340" height="64" rx="28" fill="#24282f" stroke="#83878e" stroke-width="1.2"/>
        <text x="230" y="843" fill="rgb(232,236,243)" font-size="16" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Check the services</text>
        <text x="230" y="863" fill="#a9b3c6" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">service status</text>
        <rect x="500" y="584" width="280" height="64" rx="6" fill="#1e2229"/>
        <rect x="500" y="584" width="280" height="64" rx="6" fill="#1a353a" stroke="#00aba4" stroke-width="1.2"/>
