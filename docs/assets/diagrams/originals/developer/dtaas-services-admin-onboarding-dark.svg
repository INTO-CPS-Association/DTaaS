          <marker id="dtaas-services-admin-onboarding-dark-arrow-accent" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#00aba4"/></marker>
          <marker id="dtaas-services-admin-onboarding-dark-arrow-link" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#8cc8e6"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#1e2229"/>
