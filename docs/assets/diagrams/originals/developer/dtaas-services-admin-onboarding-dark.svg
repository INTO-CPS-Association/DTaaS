<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 840 984" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dtaas-services-admin-onboarding-dark-title dtaas-services-admin-onboarding-dark-desc" id="dtaas-services-admin-onboarding-dark-root">
        <title id="dtaas-services-admin-onboarding-dark-title">Stand up platform services with dtaas-services</title>
        <desc id="dtaas-services-admin-onboarding-dark-desc">Onboarding flow for an administrator: install the dtaas-services CLI, generate a project, edit its configuration and certificates, prepare the host and start the services, install ThingsBoard or GitLab when needed, then add users and check status. Host setup and service install need root.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #dtaas-services-admin-onboarding-dark-root { --color-paper:   #1e2229;
      --color-ink:     rgb(232,236,243);
      --color-muted:   #a9b3c6;
      --color-accent:  #00aba4;
      --font-sans:     'Inter', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #dtaas-services-admin-onboarding-dark-root { font-family: var(--font-sans); color: var(--color-ink); }
      #dtaas-services-admin-onboarding-dark-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#dtaas-services-admin-onboarding-dark-root .diagram-container { overflow-x: visible; }
}</style>
