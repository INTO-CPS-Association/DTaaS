<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 940 808" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="client-user-onboarding-title client-user-onboarding-desc" id="client-user-onboarding-root">
        <title id="client-user-onboarding-title">First steps in the DTaaS web client</title>
        <desc id="client-user-onboarding-desc">Onboarding journey of a new user: open the DTaaS address and pass the gateway login, sign in to the app with GitLab, land on the Library, then author digital twins in Jupyter Lab, automate them through GitLab pipelines, or open workspace tools from the Workbench, and finally sign out.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #client-user-onboarding-root { --color-paper:   #ffffff;
      --color-ink:     rgb(0,37,70);
      --color-muted:   #47536b;
      --color-accent:  #00807a;
      --font-sans:     'Inter', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #client-user-onboarding-root { font-family: var(--font-sans); color: var(--color-ink); }
      #client-user-onboarding-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#client-user-onboarding-root .diagram-container { overflow-x: visible; }
}</style>
