<svg viewBox="0 0 1040 880" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="runner-architecture-dark-title runner-architecture-dark-desc" id="runner-architecture-dark-root">
        <title id="runner-architecture-dark-title">DT runner architecture</title>
        <desc id="runner-architecture-dark-desc">Internal architecture of the runner microservice: an HTTP request passes a Zod validation pipe to the AppController, and ExecaManager checks the command against the runner.yaml allowlist, records it in an in-memory queue and runs the matching script through execa.</desc>
