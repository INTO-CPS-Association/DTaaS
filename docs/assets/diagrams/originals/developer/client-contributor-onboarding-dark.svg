<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 840 984" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="client-contributor-onboarding-dark-title client-contributor-onboarding-dark-desc" id="client-contributor-onboarding-dark-root">
        <title id="client-contributor-onboarding-dark-title">Contribute to the web client</title>
        <desc id="client-contributor-onboarding-dark-desc">Onboarding flow for a client contributor: open the repository in the devenv container or with Node, install and configure, run the dev server, read the code from routes.tsx, run the build and test scripts, add end-to-end tests when GitLab flows change, lint and push, then open a pull request.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #client-contributor-onboarding-dark-root { --color-paper:   #1e2229;
      --color-ink:     rgb(232,236,243);
      --color-muted:   #a9b3c6;
      --color-accent:  #00aba4;
      --font-sans:     'Inter', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #client-contributor-onboarding-dark-root { font-family: var(--font-sans); color: var(--color-ink); }
      #client-contributor-onboarding-dark-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#client-contributor-onboarding-dark-root .diagram-container { overflow-x: visible; }
}</style>
