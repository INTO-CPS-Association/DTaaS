        <title id="workspace-dex-localhost-deployment-dark-title">Workspace package with Dex on localhost</title>
        <desc id="workspace-dex-localhost-deployment-dark-desc">Deployment of the deploy/workspace/dex/localhost package: Dex is published directly on port 5556 as the OIDC provider of the web client, and Traefik on port 80 routes without forward-auth to the client and one user workspace.</desc>
