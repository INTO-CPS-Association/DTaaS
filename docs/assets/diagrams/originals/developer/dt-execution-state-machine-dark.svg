<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1040 752" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dt-execution-state-machine-dark-title dt-execution-state-machine-dark-desc" id="dt-execution-state-machine-dark-root">
        <title id="dt-execution-state-machine-dark-title">DT execution state machine</title>
        <desc id="dt-execution-state-machine-dark-desc">State machine of one digital twin execution record: a start with a valid trigger token creates a RUNNING record, polling follows the parent and then the child GitLab pipeline until it completes or fails, a user stop cancels it, ten minutes without a result times it out, an exception ends it in error, and a stale poll can overwrite a cancel with a timeout.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #dt-execution-state-machine-dark-root { --color-paper:   #1e2229;
      --color-ink:     rgb(232,236,243);
      --color-muted:   #a9b3c6;
      --color-accent:  #00aba4;
      --font-sans:     'Inter', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #dt-execution-state-machine-dark-root { font-family: var(--font-sans); color: var(--color-ink); }
      #dt-execution-state-machine-dark-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#dt-execution-state-machine-dark-root .diagram-container { overflow-x: visible; }
}</style>
