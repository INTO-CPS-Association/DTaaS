          <marker id="dt-execution-state-machine-dark-arrow-accent" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#00aba4"/></marker>
          <marker id="dt-execution-state-machine-dark-arrow-link" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#8cc8e6"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#1e2229"/>
        <rect x="144" y="96" width="560" height="192" rx="8" fill="#22262d" stroke="#3a3e45" stroke-width="1"/>
        <rect x="160" y="88" width="216" height="16" rx="2" fill="#1e2229"/>
        <text x="268" y="100" fill="#94a0b8" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">COMPOSITE · STATUS RUNNING</text>
        <path d="M 48,208 L 176,208" fill="none" stroke="#a9b3c6" stroke-width="1.4" marker-end="url(#dt-execution-state-machine-dark-arrow)"/>
        <path d="M 240,168 L 240,144 Q 240,136 248,136 L 296,136 Q 304,136 304,144 L 304,168" fill="none" stroke="#a9b3c6" stroke-width="1.4" marker-end="url(#dt-execution-state-machine-dark-arrow)"/>
        <path d="M 544,168 L 544,144 Q 544,136 552,136 L 600,136 Q 608,136 608,144 L 608,168" fill="none" stroke="#a9b3c6" stroke-width="1.4" marker-end="url(#dt-execution-state-machine-dark-arrow)"/>
        <path d="M 368,208 L 480,208" fill="none" stroke="#a9b3c6" stroke-width="1.4" marker-end="url(#dt-execution-state-machine-dark-arrow)"/>
        <path d="M 672,208 L 808,208" fill="none" stroke="#a9b3c6" stroke-width="1.4" marker-end="url(#dt-execution-state-machine-dark-arrow)"/>
