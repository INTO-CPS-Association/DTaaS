        <text x="40" y="700" fill="#a9b3c6" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">LEGEND</text>
        <rect x="40" y="716" width="28" height="14" rx="4" fill="#1a353a" stroke="#00aba4" stroke-width="1.2"/>
        <text x="78" y="728" fill="#a9b3c6" font-size="13" font-family="'Inter', system-ui, sans-serif">Happy completion</text>
        <rect x="226" y="716" width="28" height="14" rx="4" fill="#262b34" stroke="rgb(232,236,243)" stroke-width="1.2"/>
        <text x="264" y="728" fill="#a9b3c6" font-size="13" font-family="'Inter', system-ui, sans-serif">Record status</text>
        <line x1="388" y1="724" x2="420" y2="724" stroke="#a9b3c6" stroke-width="1.4" marker-end="url(#dt-execution-state-machine-dark-arrow)"/>
        <text x="430" y="728" fill="#a9b3c6" font-size="13" font-family="'Inter', system-ui, sans-serif">Transition</text>
        <line x1="534" y1="724" x2="566" y2="724" stroke="#00aba4" stroke-width="1.4" marker-end="url(#dt-execution-state-machine-dark-arrow-accent)"/>
        <text x="576" y="728" fill="#a9b3c6" font-size="13" font-family="'Inter', system-ui, sans-serif">Timeout overwrites a cancel</text>
      </svg>
