        <path d="M 632,288 L 632,432" fill="none" stroke="#a9b3c6" stroke-width="1.4" marker-end="url(#dt-execution-state-machine-dark-arrow)"/>
        <path d="M 432,512 L 432,544 Q 432,552 440,552 L 624,552 Q 632,552 632,544 L 632,512" fill="none" stroke="#00aba4" stroke-width="1.8" marker-end="url(#dt-execution-state-machine-dark-arrow-accent)"/>
        <rect x="52" y="184" width="120" height="18" rx="2" fill="#1e2229"/>
        <text x="112" y="197" fill="#a9b3c6" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">START [TOKEN]</text>
        <rect x="226" y="112" width="92" height="18" rx="2" fill="#1e2229"/>
        <text x="272" y="125" fill="#a9b3c6" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">POLL · 5 S</text>
        <rect x="530" y="112" width="92" height="18" rx="2" fill="#1e2229"/>
        <text x="576" y="125" fill="#a9b3c6" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">POLL · 5 S</text>
        <rect x="374" y="184" width="100" height="18" rx="2" fill="#1e2229"/>
        <text x="424" y="197" fill="#a9b3c6" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">PARENT DONE</text>
        <rect x="680" y="184" width="120" height="18" rx="2" fill="#1e2229"/>
        <text x="740" y="197" fill="#a9b3c6" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">CHILD SUCCESS</text>
        <rect x="678" y="312" width="108" height="18" rx="2" fill="#1e2229"/>
        <text x="732" y="325" fill="#a9b3c6" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">CHILD FAILED</text>
        <rect x="240" y="351" width="84" height="18" rx="2" fill="#1e2229"/>
        <text x="282" y="364" fill="#a9b3c6" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">EXCEPTION</text>
        <rect x="440" y="351" width="84" height="18" rx="2" fill="#1e2229"/>
        <text x="482" y="364" fill="#a9b3c6" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">USER STOP</text>
        <rect x="640" y="351" width="76" height="18" rx="2" fill="#1e2229"/>
        <text x="678" y="364" fill="#a9b3c6" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">&gt; 10 MIN</text>
        <rect x="486" y="558" width="92" height="18" rx="2" fill="#1e2229"/>
        <text x="532" y="571" fill="#00aba4" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">STALE POLL</text>
        <circle cx="40" cy="208" r="8" fill="rgb(232,236,243)"/>
        <rect x="176" y="168" width="192" height="80" rx="8" fill="#1e2229"/>
        <rect x="176" y="168" width="192" height="80" rx="8" fill="#262b34" stroke="rgb(232,236,243)" stroke-width="1.2"/>
        <text x="272" y="203" fill="rgb(232,236,243)" font-size="16" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Parent pipeline</text>
        <text x="272" y="223" fill="#a9b3c6" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">getPipelineStatus</text>
        <rect x="480" y="168" width="192" height="80" rx="8" fill="#1e2229"/>
        <rect x="480" y="168" width="192" height="80" rx="8" fill="#262b34" stroke="rgb(232,236,243)" stroke-width="1.2"/>
        <text x="576" y="203" fill="rgb(232,236,243)" font-size="16" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Child pipeline</text>
        <text x="576" y="223" fill="#a9b3c6" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">getChildPipelineId</text>
        <rect x="808" y="168" width="192" height="80" rx="8" fill="#1e2229"/>
        <rect x="808" y="168" width="192" height="80" rx="8" fill="#1a353a" stroke="#00aba4" stroke-width="1.2"/>
        <text x="904" y="203" fill="rgb(232,236,243)" font-size="16" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Completed</text>
        <text x="904" y="223" fill="#a9b3c6" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">child success</text>
        <rect x="808" y="296" width="192" height="80" rx="8" fill="#1e2229"/>
        <rect x="808" y="296" width="192" height="80" rx="8" fill="#262b34" stroke="rgb(232,236,243)" stroke-width="1.2"/>
        <text x="904" y="331" fill="rgb(232,236,243)" font-size="16" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Failed</text>
        <text x="904" y="351" fill="#a9b3c6" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">failed or skipped</text>
        <rect x="144" y="432" width="176" height="80" rx="8" fill="#1e2229"/>
        <rect x="144" y="432" width="176" height="80" rx="8" fill="#262b34" stroke="rgb(232,236,243)" stroke-width="1.2"/>
        <text x="232" y="467" fill="rgb(232,236,243)" font-size="16" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Error</text>
        <text x="232" y="487" fill="#a9b3c6" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">on exception</text>
        <rect x="344" y="432" width="176" height="80" rx="8" fill="#1e2229"/>
        <rect x="344" y="432" width="176" height="80" rx="8" fill="#262b34" stroke="rgb(232,236,243)" stroke-width="1.2"/>
        <text x="432" y="467" fill="rgb(232,236,243)" font-size="16" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Canceled</text>
        <text x="432" y="487" fill="#a9b3c6" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">stopDT · user</text>
        <rect x="544" y="432" width="176" height="80" rx="8" fill="#1e2229"/>
        <rect x="544" y="432" width="176" height="80" rx="8" fill="#262b34" stroke="rgb(232,236,243)" stroke-width="1.2"/>
        <text x="632" y="467" fill="rgb(232,236,243)" font-size="16" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Timed out</text>
        <text x="632" y="487" fill="#a9b3c6" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">client only</text>
        <text x="40" y="624" fill="#a9b3c6" font-size="18" font-style="italic" font-family="'Instrument Serif', serif">A 10 s background check also settles RUNNING records; it never times out.</text>
        <text x="40" y="652" fill="#a9b3c6" font-size="18" font-style="italic" font-family="'Instrument Serif', serif">A start without a trigger token creates no record; the twin is marked error.</text>
