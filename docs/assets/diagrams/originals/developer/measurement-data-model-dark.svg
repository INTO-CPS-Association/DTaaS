        <title id="measurement-data-model-dark-title">Measurement data model</title>
        <desc id="measurement-data-model-dark-desc">Data model of the measurement feature: settings and five task definitions produce timed tasks, each with N trials of one or two execution results, tracked through active parent and child pipelines while running, and successful tasks saved as measurement records in IndexedDB.</desc>
