      #measurement-data-model-dark-root { --color-paper:   #1e2229;
      --color-ink:     rgb(232,236,243);
      --color-muted:   #a9b3c6;
      --color-accent:  #00aba4;
      --font-sans:     'Inter', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #measurement-data-model-dark-root { font-family: var(--font-sans); color: var(--color-ink); }
      #measurement-data-model-dark-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#measurement-data-model-dark-root .diagram-container { overflow-x: visible; }
}</style>
