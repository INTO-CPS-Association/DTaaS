<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stand up platform services with dtaas-services</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #1e2229;
      --color-ink:     rgb(232,236,243);
      --color-muted:   #a9b3c6;
      --color-accent:  #00aba4;
      --font-sans:     'Inter', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 840px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 840px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Onboarding · DTaaS developer docs</p>
    <h1>Stand up platform services with dtaas-services</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 840 984" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dtaas-services-admin-onboarding-dark-title dtaas-services-admin-onboarding-dark-desc">
        <title id="dtaas-services-admin-onboarding-dark-title">Stand up platform services with dtaas-services</title>
        <desc id="dtaas-services-admin-onboarding-dark-desc">Onboarding flow for an administrator: install the dtaas-services CLI, generate a project, edit its configuration and certificates, prepare the host and start the services, install ThingsBoard or GitLab when needed, then add users and check status. Host setup and service install need root.</desc>
        <defs>
          <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#a9b3c6"/></marker>
          <marker id="arrow-accent" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#00aba4"/></marker>
          <marker id="arrow-link" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#8cc8e6"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#1e2229"/>
        <path d="M 230,104 L 230,144" fill="none" stroke="#a9b3c6" stroke-width="1.4" marker-end="url(#arrow)"/>
        <path d="M 230,208 L 230,248" fill="none" stroke="#a9b3c6" stroke-width="1.4" marker-end="url(#arrow)"/>
        <path d="M 230,312 L 230,352" fill="none" stroke="#a9b3c6" stroke-width="1.4" marker-end="url(#arrow)"/>
        <path d="M 230,416 L 230,456" fill="none" stroke="#a9b3c6" stroke-width="1.4" marker-end="url(#arrow)"/>
        <path d="M 230,520 L 230,560" fill="none" stroke="#a9b3c6" stroke-width="1.4" marker-end="url(#arrow)"/>
        <path d="M 230,672 L 230,712" fill="none" stroke="#a9b3c6" stroke-width="1.4" marker-end="url(#arrow)"/>
        <path d="M 230,776 L 230,816" fill="none" stroke="#a9b3c6" stroke-width="1.4" marker-end="url(#arrow)"/>
        <path d="M 370,616 L 500,616" fill="none" stroke="#a9b3c6" stroke-width="1.4" marker-end="url(#arrow)"/>
        <path d="M 640,648 L 640,736 Q 640,744 632,744 L 400,744" fill="none" stroke="#a9b3c6" stroke-width="1.4" marker-end="url(#arrow)"/>
        <rect x="238" y="683" width="28" height="18" rx="2" fill="#1e2229"/>
        <text x="252" y="696" fill="#a9b3c6" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>
        <rect x="417" y="592" width="36" height="18" rx="2" fill="#1e2229"/>
        <text x="435" y="605" fill="#a9b3c6" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>
        <rect x="60" y="40" width="340" height="64" rx="28" fill="#1e2229"/>
        <rect x="60" y="40" width="340" height="64" rx="28" fill="#24282f" stroke="#83878e" stroke-width="1.2"/>
        <text x="230" y="67" fill="rgb(232,236,243)" font-size="16" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Install the CLI</text>
        <text x="230" y="87" fill="#a9b3c6" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">pip install dtaas-services</text>
        <rect x="60" y="144" width="340" height="64" rx="6" fill="#1e2229"/>
        <rect x="60" y="144" width="340" height="64" rx="6" fill="#262b34" stroke="rgb(232,236,243)" stroke-width="1.2"/>
        <text x="230" y="171" fill="rgb(232,236,243)" font-size="16" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Generate the project</text>
        <text x="230" y="191" fill="#a9b3c6" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">project generate</text>
        <rect x="60" y="248" width="340" height="64" rx="6" fill="#1e2229"/>
        <rect x="60" y="248" width="340" height="64" rx="6" fill="#262b34" stroke="rgb(232,236,243)" stroke-width="1.2"/>
        <text x="230" y="275" fill="rgb(232,236,243)" font-size="16" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Edit config and certs</text>
        <text x="230" y="295" fill="#a9b3c6" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">services.env · credentials.csv · CERTS_SRC</text>
        <rect x="60" y="352" width="340" height="64" rx="6" fill="#1e2229"/>
        <rect x="60" y="352" width="340" height="64" rx="6" fill="#1a353a" stroke="#00aba4" stroke-width="1.2"/>
        <text x="230" y="379" fill="rgb(232,236,243)" font-size="16" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Prepare the host</text>
        <text x="230" y="399" fill="#a9b3c6" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">sudo -E dtaas-services host setup</text>
        <rect x="60" y="456" width="340" height="64" rx="6" fill="#1e2229"/>
        <rect x="60" y="456" width="340" height="64" rx="6" fill="#262b34" stroke="rgb(232,236,243)" stroke-width="1.2"/>
        <text x="230" y="483" fill="rgb(232,236,243)" font-size="16" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Start the services</text>
        <text x="230" y="503" fill="#a9b3c6" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">service start</text>
        <polygon points="230,560 370,616 230,672 90,616" fill="#1e2229"/>
        <polygon points="230,560 370,616 230,672 90,616" fill="#262b34" stroke="rgb(232,236,243)" stroke-width="1.2"/>
        <text x="230" y="611" fill="rgb(232,236,243)" font-size="16" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">ThingsBoard</text>
        <text x="230" y="631" fill="rgb(232,236,243)" font-size="16" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">or GitLab?</text>
        <rect x="60" y="712" width="340" height="64" rx="6" fill="#1e2229"/>
        <rect x="60" y="712" width="340" height="64" rx="6" fill="#262b34" stroke="rgb(232,236,243)" stroke-width="1.2"/>
        <text x="230" y="739" fill="rgb(232,236,243)" font-size="16" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Add users</text>
        <text x="230" y="759" fill="#a9b3c6" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">user add</text>
        <rect x="60" y="816" width="340" height="64" rx="28" fill="#1e2229"/>
        <rect x="60" y="816" width="340" height="64" rx="28" fill="#24282f" stroke="#83878e" stroke-width="1.2"/>
        <text x="230" y="843" fill="rgb(232,236,243)" font-size="16" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Check the services</text>
        <text x="230" y="863" fill="#a9b3c6" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">service status</text>
        <rect x="500" y="584" width="280" height="64" rx="6" fill="#1e2229"/>
        <rect x="500" y="584" width="280" height="64" rx="6" fill="#1a353a" stroke="#00aba4" stroke-width="1.2"/>
        <text x="640" y="611" fill="rgb(232,236,243)" font-size="16" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Install, then start</text>
        <text x="640" y="631" fill="#a9b3c6" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">sudo -E … service install -s &lt;svc&gt;</text>
        <line x1="40" y1="912" x2="800" y2="912" stroke="#3a3e45" stroke-width="1"/>
        <text x="40" y="932" fill="#a9b3c6" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">LEGEND</text>
        <rect x="40" y="948" width="28" height="14" rx="7" fill="#24282f" stroke="#83878e" stroke-width="1.2"/>
        <text x="78" y="960" fill="#a9b3c6" font-size="13" font-family="'Inter', system-ui, sans-serif">Start or end</text>
        <rect x="194" y="948" width="28" height="14" rx="2" fill="#262b34" stroke="rgb(232,236,243)" stroke-width="1.2"/>
        <text x="232" y="960" fill="#a9b3c6" font-size="13" font-family="'Inter', system-ui, sans-serif">Step</text>
        <polygon points="292,955 306,948 320,955 306,962" fill="#262b34" stroke="rgb(232,236,243)" stroke-width="1.2"/>
        <text x="330" y="960" fill="#a9b3c6" font-size="13" font-family="'Inter', system-ui, sans-serif">Decision</text>
        <rect x="418" y="948" width="28" height="14" rx="2" fill="#1a353a" stroke="#00aba4" stroke-width="1.2"/>
        <text x="456" y="960" fill="#a9b3c6" font-size="13" font-family="'Inter', system-ui, sans-serif">Needs root (sudo -E)</text>
        <line x1="632" y1="956" x2="664" y2="956" stroke="#a9b3c6" stroke-width="1.4" marker-end="url(#arrow)"/>
        <text x="674" y="960" fill="#a9b3c6" font-size="13" font-family="'Inter', system-ui, sans-serif">Next step</text>
      </svg>
    </div>
  </div>
</body>
</html>
