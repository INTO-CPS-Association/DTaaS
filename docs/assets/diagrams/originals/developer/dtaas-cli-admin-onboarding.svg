        <text x="230" y="191" fill="#47536b" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">generate · edit dtaas.toml · validate</text>
        <rect x="60" y="248" width="340" height="64" rx="6" fill="#ffffff"/>
        <rect x="60" y="248" width="340" height="64" rx="6" fill="#ffffff" stroke="rgb(0,37,70)" stroke-width="1.2"/>
        <text x="230" y="275" fill="rgb(0,37,70)" font-size="16" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Generate the deployment</text>
        <text x="230" y="295" fill="#47536b" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">deployment generate --type &lt;t&gt;</text>
