        <text x="230" y="507" fill="rgb(0,37,70)" font-size="16" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Server DNS</text>
        <text x="230" y="527" fill="rgb(0,37,70)" font-size="16" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">localhost?</text>
        <rect x="60" y="608" width="340" height="64" rx="6" fill="#ffffff"/>
        <rect x="60" y="608" width="340" height="64" rx="6" fill="#ffffff" stroke="rgb(0,37,70)" stroke-width="1.2"/>
        <text x="230" y="635" fill="rgb(0,37,70)" font-size="16" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Add users</text>
        <text x="230" y="655" fill="#47536b" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">user add --file users.csv</text>
        <polygon points="230,712 370,768 230,824 90,768" fill="#ffffff"/>
        <polygon points="230,712 370,768 230,824 90,768" fill="#ffffff" stroke="rgb(0,37,70)" stroke-width="1.2"/>
