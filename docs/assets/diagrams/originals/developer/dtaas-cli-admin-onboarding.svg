          <marker id="dtaas-cli-admin-onboarding-arrow-accent" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#00807a"/></marker>
          <marker id="dtaas-cli-admin-onboarding-arrow-link" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#0b5fa5"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#ffffff"/>
