        <text x="230" y="67" fill="rgb(0,37,70)" font-size="16" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Install the CLI</text>
        <text x="230" y="87" fill="#47536b" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">pip install dtaas</text>
        <rect x="60" y="144" width="340" height="64" rx="6" fill="#ffffff"/>
        <rect x="60" y="144" width="340" height="64" rx="6" fill="#ffffff" stroke="rgb(0,37,70)" stroke-width="1.2"/>
