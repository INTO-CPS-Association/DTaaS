<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 840 1032" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dtaas-cli-admin-onboarding-title dtaas-cli-admin-onboarding-desc" id="dtaas-cli-admin-onboarding-root">
        <title id="dtaas-cli-admin-onboarding-title">Stand up DTaaS with the dtaas CLI</title>
        <desc id="dtaas-cli-admin-onboarding-desc">Onboarding flow for an administrator: install the dtaas CLI, write and validate dtaas.toml, generate a deployment, install the platform, then add users and optionally provision GitLab accounts, except on localhost where user add is not supported.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #dtaas-cli-admin-onboarding-root { --color-paper:   #ffffff;
      --color-ink:     rgb(0,37,70);
      --color-muted:   #47536b;
      --color-accent:  #00807a;
      --font-sans:     'Inter', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #dtaas-cli-admin-onboarding-root { font-family: var(--font-sans); color: var(--color-ink); }
      #dtaas-cli-admin-onboarding-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#dtaas-cli-admin-onboarding-root .diagram-container { overflow-x: visible; }
}</style>
