        <text x="230" y="783" fill="rgb(0,37,70)" font-size="16" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">provision?</text>
        <rect x="60" y="864" width="340" height="64" rx="28" fill="#ffffff"/>
        <rect x="60" y="864" width="340" height="64" rx="28" fill="#f7f8f9" stroke="#8092a2" stroke-width="1.2"/>
        <text x="230" y="891" fill="rgb(0,37,70)" font-size="16" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Check the platform</text>
        <text x="230" y="911" fill="#47536b" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">platform status</text>
