        <rect x="238" y="835" width="28" height="18" rx="2" fill="#ffffff"/>
        <text x="252" y="848" fill="#47536b" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>
