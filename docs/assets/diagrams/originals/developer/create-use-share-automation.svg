      #create-use-share-automation-root { --color-paper:   #ffffff;
      --color-ink:     rgb(0,37,70);
      --color-muted:   #47536b;
      --color-accent:  #00807a;
      --font-sans:     'Inter', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #create-use-share-automation-root { font-family: var(--font-sans); color: var(--color-ink); }
      #create-use-share-automation-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#create-use-share-automation-root .diagram-container { overflow-x: visible; }
}</style>
