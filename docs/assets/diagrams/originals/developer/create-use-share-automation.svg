<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1040 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="create-use-share-automation-title create-use-share-automation-desc" id="create-use-share-automation-root">
        <title id="create-use-share-automation-title">Create, use and share with the automation layer</title>
        <desc id="create-use-share-automation-desc">Create-use-share process in the DT automation layer: asset authors and DT creators first create and use assets and twins privately in their own GitLab project, the DT manager reconfigures a twin in the Manage tab and the user executes it as a GitLab pipeline and inspects its logs, and work is shared only when pushed to the common GitLab project.</desc>
