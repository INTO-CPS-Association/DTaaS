<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 840 984" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dtaas-services-contributor-onboarding-title dtaas-services-contributor-onboarding-desc" id="dtaas-services-contributor-onboarding-root">
        <title id="dtaas-services-contributor-onboarding-title">Contribute to the dtaas-services CLI</title>
        <desc id="dtaas-services-contributor-onboarding-desc">Onboarding flow for a dtaas-services contributor: open the repository, install with Poetry, vendor gitlab_common, read the code, run the unit tests with CI=true, add the Docker system tests when Docker behaviour changes, lint and type-check, then open a pull request.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #dtaas-services-contributor-onboarding-root { --color-paper:   #ffffff;
      --color-ink:     rgb(0,37,70);
      --color-muted:   #47536b;
      --color-accent:  #00807a;
      --font-sans:     'Inter', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #dtaas-services-contributor-onboarding-root { font-family: var(--font-sans); color: var(--color-ink); }
      #dtaas-services-contributor-onboarding-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#dtaas-services-contributor-onboarding-root .diagram-container { overflow-x: visible; }
}</style>
