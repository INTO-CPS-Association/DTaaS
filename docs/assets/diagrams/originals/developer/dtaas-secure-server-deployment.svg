<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1040 840" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dtaas-secure-server-deployment-title dtaas-secure-server-deployment-desc" id="dtaas-secure-server-deployment-root">
        <title id="dtaas-secure-server-deployment-title">DTaaS on a secure server</title>
        <desc id="dtaas-secure-server-deployment-desc">Deployment of the deploy/dtaas/docker/secure-server package: Traefik terminates TLS on port 443, redirects port 80, and checks every request with forward-auth against GitLab before routing to the client, library and logger on the frontend network and to two user workspaces on the users network.</desc>
