        <title id="features-timeline-last-year-title">DTaaS features in the last year</title>
        <desc id="features-timeline-last-year-desc">Timeline of the DTaaS features merged between 25 October 2025 and 25 October 2026, from concurrent digital twin executions and the platform services CLI through release v1.0 with the new user workspace to release v1.1 with the Material UI redesign.</desc>
