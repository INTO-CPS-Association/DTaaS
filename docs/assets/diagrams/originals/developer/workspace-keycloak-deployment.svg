      #workspace-keycloak-deployment-root { --color-paper:   #ffffff;
      --color-ink:     rgb(0,37,70);
      --color-muted:   #47536b;
      --color-accent:  #00807a;
      --font-sans:     'Inter', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #workspace-keycloak-deployment-root { font-family: var(--font-sans); color: var(--color-ink); }
      #workspace-keycloak-deployment-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#workspace-keycloak-deployment-root .diagram-container { overflow-x: visible; }
}</style>
