<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1040 824" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="workspace-keycloak-deployment-title workspace-keycloak-deployment-desc" id="workspace-keycloak-deployment-root">
        <title id="workspace-keycloak-deployment-title">Workspace package with Keycloak</title>
        <desc id="workspace-keycloak-deployment-desc">Deployment of the deploy/workspace/keycloak/production package: Traefik terminates TLS on port 443, routes /auth to Keycloak and guards the web client and two user workspaces with forward-auth, which uses Keycloak as its OIDC issuer; Keycloak keeps its realm in a named volume.</desc>
