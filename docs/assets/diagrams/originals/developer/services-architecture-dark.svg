      #services-architecture-dark-root { --color-paper:   #1e2229;
      --color-ink:     rgb(232,236,243);
      --color-muted:   #a9b3c6;
      --color-accent:  #00aba4;
      --font-sans:     'Inter', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #services-architecture-dark-root { font-family: var(--font-sans); color: var(--color-ink); }
      #services-architecture-dark-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#services-architecture-dark-root .diagram-container { overflow-x: visible; }
}</style>
