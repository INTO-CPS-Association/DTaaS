        <title id="services-architecture-dark-title">DTaaS platform services architecture</title>
        <desc id="services-architecture-dark-desc">Architecture of the platform services package: the dtaas-services CLI generates a project directory, starts the services, ThingsBoard and GitLab compose groups and creates their user accounts; ThingsBoard depends on PostgreSQL, and a separately registered GitLab runner executes CI jobs.</desc>
