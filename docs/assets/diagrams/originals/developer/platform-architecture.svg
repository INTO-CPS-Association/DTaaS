        <title id="platform-architecture-title">DTaaS platform architecture</title>
        <desc id="platform-architecture-desc">Runtime architecture of the DTaaS platform: the browser client reaches the library, logger and per-user workspaces through the Traefik gateway, and drives digital twin execution directly against GitLab, while two admin CLIs provision the workspaces and the platform services.</desc>
