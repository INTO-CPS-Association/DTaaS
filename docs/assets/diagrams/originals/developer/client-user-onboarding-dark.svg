<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 940 808" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="client-user-onboarding-dark-title client-user-onboarding-dark-desc" id="client-user-onboarding-dark-root">
        <title id="client-user-onboarding-dark-title">First steps in the DTaaS web client</title>
        <desc id="client-user-onboarding-dark-desc">Onboarding journey of a new user: open the DTaaS address and pass the gateway login, sign in to the app with GitLab, land on the Library, then author digital twins in Jupyter Lab, automate them through GitLab pipelines, or open workspace tools from the Workbench, and finally sign out.</desc>
