        <title id="dtaas-localhost-deployment-title">DTaaS on localhost</title>
        <desc id="dtaas-localhost-deployment-desc">Deployment of the deploy/dtaas/docker/localhost package: one Docker host publishes Traefik on port 80 and routes by path, without forward-auth or TLS, to the web client, the logger and a single user workspace, while the browser signs in against gitlab.com.</desc>
