        <rect x="202" y="628" width="28" height="14" rx="4" fill="#ffffff" stroke="rgb(0,37,70)" stroke-width="1.2"/>
        <text x="240" y="640" fill="#47536b" font-size="13" font-family="'Inter', system-ui, sans-serif">Task status</text>
        <rect x="352" y="628" width="28" height="14" rx="4" fill="#fafbfb" stroke="#8092a2" stroke-width="1.2" stroke-dasharray="5,4"/>
        <text x="390" y="640" fill="#47536b" font-size="13" font-family="'Inter', system-ui, sans-serif">Per trial</text>
        <line x1="486" y1="636" x2="518" y2="636" stroke="#47536b" stroke-width="1.4" marker-end="url(#measurement-state-machine-arrow)"/>
        <text x="528" y="640" fill="#47536b" font-size="13" font-family="'Inter', system-ui, sans-serif">Transition</text>
        <line x1="632" y1="636" x2="664" y2="636" stroke="#47536b" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#measurement-state-machine-arrow)"/>
        <text x="674" y="640" fill="#47536b" font-size="13" font-family="'Inter', system-ui, sans-serif">Back to loop</text>
        <line x1="790" y1="636" x2="822" y2="636" stroke="#00807a" stroke-width="1.4" marker-end="url(#measurement-state-machine-arrow-accent)"/>
        <text x="832" y="640" fill="#47536b" font-size="13" font-family="'Inter', system-ui, sans-serif">Save to IndexedDB</text>
      </svg>
