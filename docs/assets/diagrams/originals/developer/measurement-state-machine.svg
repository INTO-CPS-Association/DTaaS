        <text x="148" y="283" fill="rgb(0,37,70)" font-size="16" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Not started</text>
        <text x="148" y="303" fill="#47536b" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">NOT_STARTED</text>
        <rect x="288" y="248" width="152" height="80" rx="8" fill="#ffffff"/>
