        <text x="514" y="208" fill="#47536b" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">NEXT TRIAL</text>
        <rect x="632" y="195" width="92" height="18" rx="2" fill="#ffffff"/>
        <text x="678" y="208" fill="#47536b" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">TRIAL ENDS</text>
        <rect x="678" y="264" width="100" height="18" rx="2" fill="#ffffff"/>
        <text x="728" y="277" fill="#47536b" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">TRIALS DONE</text>
        <rect x="939" y="264" width="44" height="18" rx="2" fill="#ffffff"/>
        <text x="961" y="277" fill="#00807a" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">SAVE</text>
        <rect x="292" y="359" width="44" height="18" rx="2" fill="#ffffff"/>
        <text x="314" y="372" fill="#47536b" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">STOP</text>
        <rect x="412" y="336" width="120" height="18" rx="2" fill="#ffffff"/>
        <text x="472" y="349" fill="#47536b" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">STOP · RELOAD</text>
