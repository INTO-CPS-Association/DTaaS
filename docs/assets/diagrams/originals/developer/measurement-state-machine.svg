        <text x="754" y="349" fill="#47536b" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">A TRIAL FAILED</text>
        <circle cx="40" cy="288" r="8" fill="rgb(0,37,70)"/>
