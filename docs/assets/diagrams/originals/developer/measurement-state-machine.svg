<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1040 664" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="measurement-state-machine-title measurement-state-machine-desc" id="measurement-state-machine-root">
        <title id="measurement-state-machine-title">Measurement task lifecycle</title>
        <desc id="measurement-state-machine-desc">Lifecycle of one measurement task: it starts not started, becomes pending when the run starts, runs its trials one after another with each trial running its executions in parallel, and ends in success, which is saved to IndexedDB, in failure when a trial failed, or stopped by the user or a page reload.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #measurement-state-machine-root { --color-paper:   #ffffff;
      --color-ink:     rgb(0,37,70);
      --color-muted:   #47536b;
      --color-accent:  #00807a;
      --font-sans:     'Inter', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #measurement-state-machine-root { font-family: var(--font-sans); color: var(--color-ink); }
      #measurement-state-machine-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#measurement-state-machine-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="measurement-state-machine-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#47536b"/></marker>
          <marker id="measurement-state-machine-arrow-accent" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#00807a"/></marker>
          <marker id="measurement-state-machine-arrow-link" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#0b5fa5"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#ffffff"/>
        <rect x="40" y="48" width="960" height="136" rx="8" fill="#fafbfb" stroke="#dbe0e5" stroke-width="1"/>
        <rect x="56" y="40" width="216" height="16" rx="2" fill="#ffffff"/>
        <text x="164" y="52" fill="#5f6b85" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">LOOP · ONE TRIAL AT A TIME</text>
        <rect x="40" y="384" width="960" height="136" rx="8" fill="#fafbfb" stroke="#dbe0e5" stroke-width="1"/>
        <rect x="56" y="376" width="148" height="16" rx="2" fill="#ffffff"/>
        <text x="130" y="388" fill="#5f6b85" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">TERMINAL OUTCOMES</text>
