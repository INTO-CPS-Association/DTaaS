        <text x="364" y="283" fill="rgb(0,37,70)" font-size="16" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Pending</text>
        <text x="364" y="303" fill="#47536b" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">PENDING</text>
        <rect x="520" y="248" width="152" height="80" rx="8" fill="#ffffff"/>
        <rect x="520" y="248" width="152" height="80" rx="8" fill="#ffffff" stroke="rgb(0,37,70)" stroke-width="1.2"/>
        <text x="596" y="283" fill="rgb(0,37,70)" font-size="16" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Running</text>
        <text x="596" y="303" fill="#47536b" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">RUNNING · n of N</text>
        <rect x="784" y="248" width="152" height="80" rx="8" fill="#ffffff"/>
        <rect x="784" y="248" width="152" height="80" rx="8" fill="#e6f7f6" stroke="#00807a" stroke-width="1.2"/>
        <text x="860" y="283" fill="rgb(0,37,70)" font-size="16" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Success</text>
        <text x="860" y="303" fill="#47536b" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">SUCCESS</text>
        <rect x="508" y="80" width="176" height="80" rx="8" fill="#ffffff"/>
        <rect x="508" y="80" width="176" height="80" rx="8" fill="#fafbfb" stroke="#8092a2" stroke-width="1.2" stroke-dasharray="5,4"/>
        <text x="596" y="115" fill="rgb(0,37,70)" font-size="16" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Trial in flight</text>
        <text x="596" y="135" fill="#47536b" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">parallel executions</text>
        <rect x="288" y="416" width="152" height="80" rx="8" fill="#ffffff"/>
        <rect x="288" y="416" width="152" height="80" rx="8" fill="#ffffff" stroke="rgb(0,37,70)" stroke-width="1.2"/>
