        <text x="364" y="471" fill="#47536b" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">STOPPED</text>
        <rect x="784" y="416" width="152" height="80" rx="8" fill="#ffffff"/>
        <rect x="784" y="416" width="152" height="80" rx="8" fill="#ffffff" stroke="rgb(0,37,70)" stroke-width="1.2"/>
        <text x="860" y="451" fill="rgb(0,37,70)" font-size="16" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Failure</text>
        <text x="860" y="471" fill="#47536b" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">FAILURE</text>
        <circle cx="996" cy="288" r="10" fill="#ffffff" stroke="rgb(0,37,70)" stroke-width="1.4"/>
        <circle cx="996" cy="288" r="6" fill="rgb(0,37,70)"/>
        <text x="40" y="560" fill="#47536b" font-size="18" font-style="italic" font-family="'Instrument Serif', serif">Restart or Purge returns every task to Not started; Purge also clears IndexedDB.</text>
