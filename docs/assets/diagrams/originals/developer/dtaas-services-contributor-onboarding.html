<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contribute to the dtaas-services CLI</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #ffffff;
      --color-ink:     rgb(0,37,70);
      --color-muted:   #47536b;
      --color-accent:  #00807a;
      --font-sans:     'Inter', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 840px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 840px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Onboarding · DTaaS developer docs</p>
    <h1>Contribute to the dtaas-services CLI</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 840 984" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dtaas-services-contributor-onboarding-title dtaas-services-contributor-onboarding-desc">
        <title id="dtaas-services-contributor-onboarding-title">Contribute to the dtaas-services CLI</title>
        <desc id="dtaas-services-contributor-onboarding-desc">Onboarding flow for a dtaas-services contributor: open the repository, install with Poetry, vendor gitlab_common, read the code, run the unit tests with CI=true, add the Docker system tests when Docker behaviour changes, lint and type-check, then open a pull request.</desc>
        <defs>
          <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#47536b"/></marker>
          <marker id="arrow-accent" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#00807a"/></marker>
          <marker id="arrow-link" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#0b5fa5"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#ffffff"/>
        <path d="M 230,104 L 230,144" fill="none" stroke="#47536b" stroke-width="1.4" marker-end="url(#arrow)"/>
        <path d="M 230,208 L 230,248" fill="none" stroke="#47536b" stroke-width="1.4" marker-end="url(#arrow)"/>
        <path d="M 230,312 L 230,352" fill="none" stroke="#47536b" stroke-width="1.4" marker-end="url(#arrow)"/>
        <path d="M 230,416 L 230,456" fill="none" stroke="#47536b" stroke-width="1.4" marker-end="url(#arrow)"/>
        <path d="M 230,520 L 230,560" fill="none" stroke="#47536b" stroke-width="1.4" marker-end="url(#arrow)"/>
        <path d="M 230,672 L 230,712" fill="none" stroke="#47536b" stroke-width="1.4" marker-end="url(#arrow)"/>
        <path d="M 230,776 L 230,816" fill="none" stroke="#47536b" stroke-width="1.4" marker-end="url(#arrow)"/>
        <path d="M 370,616 L 500,616" fill="none" stroke="#47536b" stroke-width="1.4" marker-end="url(#arrow)"/>
        <path d="M 640,648 L 640,736 Q 640,744 632,744 L 400,744" fill="none" stroke="#47536b" stroke-width="1.4" marker-end="url(#arrow)"/>
        <rect x="238" y="683" width="28" height="18" rx="2" fill="#ffffff"/>
        <text x="252" y="696" fill="#47536b" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>
        <rect x="417" y="592" width="36" height="18" rx="2" fill="#ffffff"/>
        <text x="435" y="605" fill="#47536b" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>
        <rect x="60" y="40" width="340" height="64" rx="28" fill="#ffffff"/>
        <rect x="60" y="40" width="340" height="64" rx="28" fill="#f7f8f9" stroke="#8092a2" stroke-width="1.2"/>
        <text x="230" y="67" fill="rgb(0,37,70)" font-size="16" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Open the repository</text>
        <text x="230" y="87" fill="#47536b" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">developer/devenv or Python 3.10+</text>
        <rect x="60" y="144" width="340" height="64" rx="6" fill="#ffffff"/>
        <rect x="60" y="144" width="340" height="64" rx="6" fill="#ffffff" stroke="rgb(0,37,70)" stroke-width="1.2"/>
        <text x="230" y="171" fill="rgb(0,37,70)" font-size="16" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Install</text>
        <text x="230" y="191" fill="#47536b" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">cd deploy/services/cli · poetry install</text>
        <rect x="60" y="248" width="340" height="64" rx="6" fill="#ffffff"/>
        <rect x="60" y="248" width="340" height="64" rx="6" fill="#e6f7f6" stroke="#00807a" stroke-width="1.2"/>
        <text x="230" y="275" fill="rgb(0,37,70)" font-size="16" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Vendor gitlab_common</text>
        <text x="230" y="295" fill="#47536b" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">python -m dtaas_services.pkg.build</text>
        <rect x="60" y="352" width="340" height="64" rx="6" fill="#ffffff"/>
        <rect x="60" y="352" width="340" height="64" rx="6" fill="#ffffff" stroke="rgb(0,37,70)" stroke-width="1.2"/>
        <text x="230" y="379" fill="rgb(0,37,70)" font-size="16" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Read the code</text>
        <text x="230" y="399" fill="#47536b" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">cmd.py · commands/ · pkg/lib/manager.py</text>
        <rect x="60" y="456" width="340" height="64" rx="6" fill="#ffffff"/>
        <rect x="60" y="456" width="340" height="64" rx="6" fill="#e6f7f6" stroke="#00807a" stroke-width="1.2"/>
        <text x="230" y="483" fill="rgb(0,37,70)" font-size="16" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Run the unit tests</text>
        <text x="230" y="503" fill="#47536b" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">CI=true pytest --ignore=tests/system_tests</text>
        <polygon points="230,560 370,616 230,672 90,616" fill="#ffffff"/>
        <polygon points="230,560 370,616 230,672 90,616" fill="#ffffff" stroke="rgb(0,37,70)" stroke-width="1.2"/>
        <text x="230" y="611" fill="rgb(0,37,70)" font-size="16" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Docker code</text>
        <text x="230" y="631" fill="rgb(0,37,70)" font-size="16" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">changed?</text>
        <rect x="60" y="712" width="340" height="64" rx="6" fill="#ffffff"/>
        <rect x="60" y="712" width="340" height="64" rx="6" fill="#ffffff" stroke="rgb(0,37,70)" stroke-width="1.2"/>
        <text x="230" y="739" fill="rgb(0,37,70)" font-size="16" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Lint and type-check</text>
        <text x="230" y="759" fill="#47536b" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">pylint ≥ 9.0 · pyright</text>
        <rect x="60" y="816" width="340" height="64" rx="28" fill="#ffffff"/>
        <rect x="60" y="816" width="340" height="64" rx="28" fill="#f7f8f9" stroke="#8092a2" stroke-width="1.2"/>
        <text x="230" y="843" fill="rgb(0,37,70)" font-size="16" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">Open a pull request</text>
        <text x="230" y="863" fill="#47536b" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">services CLI workflow · Codecov</text>
        <rect x="500" y="584" width="280" height="64" rx="6" fill="#ffffff"/>
        <rect x="500" y="584" width="280" height="64" rx="6" fill="#ffffff" stroke="rgb(0,37,70)" stroke-width="1.2"/>
        <text x="640" y="611" fill="rgb(0,37,70)" font-size="16" font-weight="600" font-family="'Inter', system-ui, sans-serif" text-anchor="middle">System tests</text>
        <text x="640" y="631" fill="#47536b" font-size="12" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">pytest tests/system_tests · Docker</text>
        <line x1="40" y1="912" x2="800" y2="912" stroke="#dbe0e5" stroke-width="1"/>
        <text x="40" y="932" fill="#47536b" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">LEGEND</text>
        <rect x="40" y="948" width="28" height="14" rx="7" fill="#f7f8f9" stroke="#8092a2" stroke-width="1.2"/>
        <text x="78" y="960" fill="#47536b" font-size="13" font-family="'Inter', system-ui, sans-serif">Start or end</text>
        <rect x="194" y="948" width="28" height="14" rx="2" fill="#ffffff" stroke="rgb(0,37,70)" stroke-width="1.2"/>
        <text x="232" y="960" fill="#47536b" font-size="13" font-family="'Inter', system-ui, sans-serif">Step</text>
        <polygon points="292,955 306,948 320,955 306,962" fill="#ffffff" stroke="rgb(0,37,70)" stroke-width="1.2"/>
        <text x="330" y="960" fill="#47536b" font-size="13" font-family="'Inter', system-ui, sans-serif">Decision</text>
        <rect x="418" y="948" width="28" height="14" rx="2" fill="#e6f7f6" stroke="#00807a" stroke-width="1.2"/>
        <text x="456" y="960" fill="#47536b" font-size="13" font-family="'Inter', system-ui, sans-serif">Non-obvious command</text>
        <line x1="624" y1="956" x2="656" y2="956" stroke="#47536b" stroke-width="1.4" marker-end="url(#arrow)"/>
        <text x="666" y="960" fill="#47536b" font-size="13" font-family="'Inter', system-ui, sans-serif">Next step</text>
      </svg>
    </div>
  </div>
</body>
</html>
