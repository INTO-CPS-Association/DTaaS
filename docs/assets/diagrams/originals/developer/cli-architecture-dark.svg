        <title id="cli-architecture-dark-title">DTaaS CLI architecture</title>
        <desc id="cli-architecture-dark-desc">Internal architecture of the dtaas admin CLI: Click commands dispatch to the config, deployment, user and platform modules, which copy vendored templates into a deployment directory, drive Docker Compose and optionally provision GitLab accounts.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #cli-architecture-dark-root { --color-paper:   #1e2229;
      --color-ink:     rgb(232,236,243);
      --color-muted:   #a9b3c6;
      --color-accent:  #00aba4;
      --font-sans:     'Inter', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #cli-architecture-dark-root { font-family: var(--font-sans); color: var(--color-ink); }
      #cli-architecture-dark-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#cli-architecture-dark-root .diagram-container { overflow-x: visible; }
}</style>
