[tool.poetry]
name = "gitlab-common"
version = "0.4.0"
description = "Provider-agnostic GitLab operations shared across DTaaS packages"
authors = ["Mohamed Abdulkarim"]
license = "INTO-CPS-Association"
readme = "README.md"
packages = [{include = "gitlab_common"}]

[tool.poetry.dependencies]
python = "^3.10"
python-gitlab = "^8.6.0"
requests = "^2.34.2"

[tool.poetry.group.dev.dependencies]
pytest = "^9.2.0"
pytest-cov = "^7.1.0"
pytest-mock = "^3.17.0"
pylint = "^4.1.3"
pyright = "^1.1.414"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--strict-markers"

[tool.pyright]
include = ["gitlab_common", "tests"]
pythonVersion = "3.10"
typeCheckingMode = "basic"

[tool.coverage.run]
# Report paths relative to this folder (gitlab_common/users.py rather than a
# bare users.py), so Codecov can match them to lib/gitlab_common and not to
# another users.py elsewhere in the repository.
relative_files = true
