[tool.poetry]
name = "gitlab-common"
version = "0.1.0"
description = "Provider-agnostic GitLab operations shared across DTaaS packages"
authors = ["Mohamed Abdulkarim"]
license = "INTO-CPS-Association"
readme = "README.md"
packages = [{include = "gitlab_common"}]

[tool.poetry.dependencies]
python = "^3.10"
python-gitlab = "^8.3.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
pytest-cov = "^7.1.0"
pytest-mock = "^3.15.1"
pylint = "^4.0.6"
pyright = "^1.1.411"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--strict-markers"

[tool.pyright]
include = ["gitlab_common", "tests"]
pythonVersion = "3.10"
typeCheckingMode = "basic"
